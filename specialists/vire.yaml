notes: >-
  Vire rooms (Dungeon 4 scouting, Nov 11; not trained): a Vire hops toward Link and splits into two Red Keese when
  hit with less than a killing blow. Dungeon 4's empty entrance hall 0x71 (S to N) and triforce room 0x03 (ends on
  pickup), as zol holds Dungeon 3's; 0x61 (three Vires: S to N); the dark 0x50 (five: E to N); the dark 0x30 (three
  Vires and two Bubbles: S in, E through the locked door; later E in, N through the other locked door); 0x31, a
  water maze whose land path winds from the W door to the E shutter (five Vires: kill them all to open it on the way
  to the Breakfast Room; back from E to W); 0x20, a water ring (five: S to E); 0x12 (five: in through the W wall
  bombed from the rupee room, kill them, push the block to open the E shutter into Gleeok's room). Copied from zol
  (one-room, curriculum, 2000 steps).
