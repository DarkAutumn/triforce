name: wallmaster
rooms: ['(1, 0x45)']
start_states: ['1_45*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true, item_targets: true}   # round 10 §9 (r41): dropped items are shaping targets
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target (r41)
ram_randomization: {hp: [0.15, max], full_hp: 0.5}   # [0.15, 0.5] collapsed (r11, round 5)
items: {bombs: false}
curriculum: {enabled: true}             # trajectories/wallmaster
one_room: true
max_steps: 2000
warm_start: null
notes: >-
  Wallmaster rooms (was the second half of d1-wallmaster). Dungeon 1: 8 Wallmasters, key, exit N through a locked
  door. Wallmaster shaping is applied by the default critic whenever a Wallmaster is present.
