name: wallmaster
rooms: ['(1, 0x45)', '(7, 0x0d)']
start_states: ['1_45*_[0-9]', '7_0d*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true, item_targets: true}   # round 10 §9 (r41): dropped items are shaping targets
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target (r41)
# hp [0.15, 0.5] collapsed (r11, round 5).  room_kills (round 26): half the resets into 7:0x0d bank 1-4 of its five
# Wallmasters' kills, so fewer hands are left to lure and strike before the push (training only).
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9],
                    room_kills: {'(7, 0x0d)': [1, 4]}, room_kills_share: 0.5}
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/wallmaster
# Round 30 (round30.md): a third of the resets from 7:0x0d's handoffs at the hearts runs bring (triforce/states/
# harvested/wallmaster, not in git: `eval-chain --from 0_0bc_0 --stop-at step:248 --runs 300 --first-seed 5000
# --harvest DIR`, its wallmaster/ files).
harvested_fraction: 0.33
one_room: true
max_steps: 2000
warm_start: null
notes: >-
  Wallmaster rooms (was the second half of d1-wallmaster). Dungeon 1: 8 Wallmasters, key, exit N through a locked
  door. Wallmaster shaping is applied by the default critic whenever a Wallmaster is present. Dungeon 7 (round 26;
  docs/routes/d7.md, d7-walks.md §7): 0x0d from W, five Wallmasters that come out of the wall only where Link
  stands by it (a grab carries him back to 0x79: an `exit-wrong` and the dungeon again), three Bubbles; the room
  clear, the block pushed W, the stairs in the NE corner down to the tunnel.
