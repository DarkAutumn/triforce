name: lanmola
rooms: ['(9, 0x55)']
start_states: ['9_55*_[0-9]']
trainable: true                            # round 29's states step: 9_55s on chains 0-2
success: [exit-correct]                    # down its stairs into the tunnel to 0x14
reward_profile: default
reward: {pbrs: true, item_targets: true, heart_value: {exit: true, potential: 20}}   # as moldorm (round 25): hearts priced by their worth to the run
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # as moldorm (round 25)
items: {bombs: free}                       # as moldorm: a bomb takes 3 segments in the median; only above the route's reserve (3 here: on a run with no drops there is none to spend)
clips: {enabled: true, off_share: 0}       # round 29: the block clip of 9:0x55 to its stairs; the owner, Nov 18: the room is bypassed by the clip and nothing else (no episode with CLIP masked, the fight is not trained)
curriculum:                              # trajectories/lanmola, once explored
  enabled: true                           # round 45: d3first's walked 9x55 E tracked too (Tracks45)
one_room: true
max_steps: 3000
warm_start: moldorm                        # round 29: a first training starts from moldorm's promoted run (a worm of segments; settings copied from it)
harvested_fraction: 0.25                  # round 33: chain handoffs at the route's hearts (9:0x55 from E, 300, from 0_6dc_0), triforce/states/harvested/lanmola, not in git (docs/experiments/round33.md)
notes: >-
  The red Lanmolas (Dungeon 9's 0x55, round 29, route `d9`; docs/routes/d9.md "as built", d9-fights-walks.md §1).
  Two worms of five segments each come out at ($40, $8D), a segment every 8 frames, 1 pixel a frame (Link walks 1.5);
  a touch is 2 hearts (half with the red ring, which the route does not hold here), a segment that was just hit is
  harmless while it flashes, one swing takes up to three segments and the beam kills them too. A hit kills the
  worm's lowest slot (it turns into a dead dummy, which counts as a kill here though the game's room count moves
  only with a head); the block moves when both heads are dead: push the ring's W block N from ($60, $9D), up to Y
  $8D and E onto the stairs. Once a head has died the room stays empty for every later entry. A rule reading
  positions clears it 20 of 20 at 1.0 hearts (289 frames) and reaches the cellar in 615 frames; six families
  zero-shot died in 178 of 180 episodes. Settings copied from moldorm (the nearest: a worm of segments).
  Round 29's second round (round29.md §17): the room is clipped, not fought: up X $60 from the S door to Y $9D, CLIP
  N, onto the stairs (`r29_clip_demos.py clip-55`: 15 decisions, no heart lost). The first run reached a CLIP point
  after 34 decisions on average, wandering the S rows; its curriculum is the rule's tracks now (the explorer's
  wandering ones set aside).
