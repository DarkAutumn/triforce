name: dodongo-crossing
rooms: ['(5, 0x56)', '(7, 0x0c)']
start_states: ['5_56*_[0-9]', '7_0c*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true, item_targets: true}   # dungeon family (round 10 §8): dropped items are shaping targets
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chains arrive with partial hearts (round 5)
items: {bombs: required}                   # the owner (Nov 14): the Dodongos' bombs are no objective, a pass-through is fine; the 10th kill's bomb stays; round 26: `required` (7:0x0c's E wall; 5:0x56 has none, so the same as `tenth` there)
curriculum: {enabled: true}             # trajectories/dodongo-crossing (Go-Explore paths per start state)
one_room: true
max_steps: 300                             # round 24: explored tracks 25-42 steps
warm_start: null
notes: >-
  The Dodongo crossing (Dungeon 5, round 24; docs/routes/d5.md): 5:0x56, three Dodongos, S to E, walked past (the
  room's bombs, shown when they die, skipped: `treasure: skip`). The sword does nothing to a Dodongo; row 6, then up
  column 11 to the E door was untouched in 54 of 54 measured runs. Not a boss room (no `boss-` prefix: the entry-state
  audit's boss rules don't apply); boss-dodongo is Dungeon 2's single Dodongo fight. The owner: a model that learns to
  kill them for their bombs is fine. Copied from zol (one-room, curriculum).
