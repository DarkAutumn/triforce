name: boss-digdogger
rooms: ['(5, 0x24)', '(7, 0x1c)', '(7, 0x39)']
start_states: ['5_24*_[0-9]']
success: [exit-correct]                    # the recorder, kill the small one, take the heart container, leave N to 0x14
reward_profile: default
reward: {pbrs: true, item_targets: true}   # dungeon family (round 10 §8)
obs: {objective: true, target: true}       # schema 2
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}
items: {bombs: free, recorder: true}       # the owner (Nov 14): bombs on the boss (the route's reserve is 0 here); the recorder splits him
curriculum: {enabled: true}             # trajectories/boss-digdogger (Go-Explore paths per start state)
one_room: true
max_steps: 600                             # round 24: explored tracks 91-142 steps (the recorder, the kill, the heart, N)
warm_start: null
notes: >-
  Digdogger (Dungeon 5, round 24; docs/routes/d5.md): the big body (32x32, object $38) can't be hurt; the recorder
  played in the room shrinks it inside the recorder's freeze, and at the freeze's end (152 frames after the B press)
  it is the small one ($18, HP $80: four white-sword hits, a bomb takes half). The fastest the game allows (measured):
  a bomb on the big one's top-left, the recorder within 46 frames, the sword on the small one's first hittable frame
  with the bomb, one more hit when its flash ends. Statue fireballs can't be blocked (no magic shield). Entered from E
  through the key door; the heart container (11 hearts) appears on the kill; the N shutter to the triforce room 0x14.
  RECORDER (round 24) is offered while the big one hasn't heard it: the play that starts the split pays
  reward-recorder-split once, and the small one's hits are boss hits (reward-boss-hit). Copied from boss-manhandla.
