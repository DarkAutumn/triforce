name: ow-lynel
rooms: ['(0, 0x0a)', '(0, 0x0a, cave)']
start_states: ['0_0a*_[0-9]']
success: [exit-correct]
endings: {retreat: soft-failure}           # Lee (Nov 8): a retreat counts as a wrong exit for the first baseline
reward_profile: default
reward: {pbrs: true}
obs: {objective: true, target: true}       # schema 2 pointer, no item targets (as ow-moblin)
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chain arrives with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
one_room: true                          # round 5: per-room episodes
max_steps: 600
warm_start: null
notes: >-
  Lynel rooms (Lee, Nov 8: very hard monsters, the main enemy of many later rooms). 0x0a (Blue Lynel and a Zora)
  with the white-sword cave: enter the cave, take the sword (needs 5 heart containers), leave S. Leaving S before
  the sword (to re-enter for a better Lynel spawn) ends the episode as `retreat` (routes.yaml `retreat: S`); the
  ending is configurable and is a soft failure (like a wrong exit, with its wrong-location penalty) for the first
  baseline. Lee will study Lynel spawns and may make it neutral, possibly only when the Lynel blocks the way
  (docs/routes/d2first.md).
