items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/ow-peahat (Go-Explore paths per start state): not explored yet
one_room: true                          # round 5: per-room episodes
max_steps: 600
trainable: false                        # Dungeon 4 is scouted, not trained (Lee, Nov 11): set true to train it
warm_start: null
notes: >-
  Peahat rooms (Dungeon 4 scouting, Nov 11; not trained): a Peahat flies and can only be hit while it rests. 0x45,
  the island of Dungeon 4 (one Peahat): Link lands on the pier at the bottom, by raft from the dock of 0x55, and
  walks N into the dungeon's mouth. Copied from ow-leever (one-room, 600 steps, curriculum).
