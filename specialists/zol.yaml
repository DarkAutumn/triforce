name: zol
rooms: ['(3, 0x7c)', '(3, 0x7b)', '(3, 0x6b)', '(3, 0x49)', '(3, 0x4b)', '(3, 0x3d)', '(4, 0x40)', '(5, 0x57)', '(6, 0x68)']
start_states: ['3_7c*_[0-9]', '3_7b*_[0-9]', '3_6b*_[0-9]', '3_49*_[0-9]', '3_3d*_[0-9]', '4_40*_[0-9]', '5_57*_[0-9]']
success: [exit-correct, triforce-collected]   # 0x3d ends on the D3 triforce
reward_profile: default
reward: {pbrs: true, item_targets: true, heart_value: {exit: true, potential: 20}}   # dungeon family (round 10 §8): dropped items are shaping targets; round 25: hearts priced by their worth to the run
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chains arrive with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/zol (Go-Explore paths per start state)
one_room: true
max_steps: 2000
warm_start: null
notes: >-
  Zol rooms (Nov 9; Zols split into Gels when hit, hop like them): Dungeon 3's empty entrance hall 0x7c (S to W),
  the Zol key rooms 0x7b (key visible; E to N), 0x6b (key when all are dead; S to N), 0x4b (key when all are dead;
  S to E through the locked door into the trap room 0x4c; off the route since round 22: tagged, no start state), 0x49 (Bubbles, Zols and Blue Keese, key visible; S and
  back S), and the empty triforce room 0x3d (ends on pickup), as stalfos-keese-gel holds D1's hall and triforce
  room. Copied from stalfos-keese-gel/goriya (one-room, curriculum, 2000 steps). Dungeon 4 (Nov 11-12): its dark
  Zol room 0x40 (five Zols, the key in the open from the start: take it, S to N). Dungeon 5 (round 24): the dark 0x57
  (five Zols) W to N along row 3 by the ladder, not stopping for the 5 rupees its kills show (`treasure: skip`).
  Dungeon 6 (round 27, route `d6`; no start state yet): 0x68 (five Zols) S to N straight up, its compass left
  (`treasure: skip`; walked zero-shot 20 of 20).
