# ow-leever@d3first: the task of the family's run for d3first's wood-sword half (promoted.d3first is r32d1-leever),
# rebuilt (the yaml it trained on lived in its round's worktree, gone): the family's yaml with state_routes
# [d3first] and the run's own terms as its run.json and docs/experiments/round32.md ("Arm") record them: harvested
# handoffs at 0.25, no chain_hp. The lab reads this file for the key f"{family}@d3first" (lab.collect.task_yaml).
extends: _generation.yaml                 # the fresh generation's switches (2.0.1.0; round40.md "The generation's tasks")
name: ow-leever
rooms:
- (0, 0x48)
- (0, 0x75)
- (0, 0x0b)
- (0, 0x34)
- (0, 0x34, cave)
- (0, 0x29)
- (0, 0x2a)
- (0, 0x2b)
start_states:
- 0_48*_[0-9]
- 0_75*_[0-9]
- 0_0b*_[0-9]
- 0_34*_[0-9]
- 0_29*_[0-9]
- 0_2a*_[0-9]
- 0_2b*_[0-9]
success:
- exit-correct
- enter-room:5:0x76
reward_profile: default
reward:
  pbrs: true
obs:
  objective: true
  target: true
ram_randomization:
  hp:
  - 0.15
  - max
  full_hp: 0.5
  bombs:
  - 0
  - 8
  bombs_share: 0.5
items:
  bombs: tenth
  recorder: true
clips:
  enabled: true
  off_share: 0
curriculum:
  enabled: true
one_room: true
max_steps: 600
warm_start: null
notes: 'Leever rooms (Nov 9): Leevers burrow and surface next to Link, unlike anything in the other overworld families.
  0x48 (Red Leever x4 and a Zora) is forced on the way from Dungeon 1 (0x37) to Dungeon 3 (0x74): from N (0x38) leave S
  (0x58). Round 22 (the wrap way to Dungeon 3, clips): 0x75 (two Blue and a Red Leever, three Peahats, a Zora) from E into
  its E part, cut off by the river: leave W by CLIP E on a row Y $65-$AD (the wrap exit through its solid W edge into 0x74;
  never offered on the softlock rows). Copied from ow-moblin (one-room, 600 steps, curriculum). Round 24: 0x0b (one Red
  Leever, Dungeon 5''s entrance at tile (14, 8)) from S out of the Lost Hills (the plain mountain way, `0_0bs`: switch off)
  or from E by 0x0c''s wrap exit (the clip way, `0_0be`: switch on): down the stairs into 5:0x76 (`enter-room:5:0x76`).'
state_routes:
- d3first
