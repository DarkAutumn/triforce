# darknut@d3first: the task of the family's run for d3first's wood-sword half (promoted.d3first is r34d5-dg-s362),
# rebuilt (the yaml it trained on lived in its round's worktree, gone): the family's yaml with state_routes
# [d3first] and the run's own terms as its run.json and docs/experiments/round34.md ("The Olive Garden") record
# them: harvested handoffs at 0.33 (the run's dir of 8,580 handoffs, the Garden a third, was not kept), no chain_hp.
# The lab reads this file for the key f"{family}@d3first" (lab.collect.task_yaml).
# Round 39 (the owner, Nov 22: "3:0x5b with a full bag walks between the wall and the bombs"; round38.md "The owner's
# three causes"): the run was trained before 2.0.0.6's bomb rules, when 0x5b's last pass took the room's bombs at any
# count. Its continuation trains 0x5b under today's order (a full bag: the wall, then the room's bombs, then out) with
# full-bag starts: `room_bombs` gives half of 0x5b's resets 8 bombs, and `room_kills` banks 2 or 3 of its 3 Darknuts
# in half the staged resets (one Darknut left, or the room's bombs already lying when Link comes in).
name: darknut
rooms:
- (3, 0x5b)
- (3, 0x59)
- (3, 0x69)
- (3, 0x5c)
- (5, 0x64)
- (5, 0x06)
- (5, 0x05)
- (5, 0x37)
- (8, 0x5e)
- (8, 0x4e)
- (8, 0x3e)
- (8, 0x3f)
start_states:
- 3_5b*_[0-9]
- 3_59*_[0-9]
- 3_69*_[0-9]
- 3_5c*_[0-9]
- 5_64*_[0-9]
- 5_06*_[0-9]
- 5_05*_[0-9]
- 5_37*_[0-9]
- 8_5e*_[0-9]
- 8_4e*_[0-9]
- 8_3e*_[0-9]
- 8_3f*_[0-9]
