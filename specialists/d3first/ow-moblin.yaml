notes: 'Moblin rooms. 0x5b, 0x5c, 0x5d and 0x4d from S on the way to D2; 0x4d from W and 0x3d after it. 0x5b''s E edge has
  two openings and only the upper one reaches 0x5c''s E exit (game.yaml `span`). On to D3 (Nov 9): 0x63 (Moblins and slow
  Octoroks) from E leaves S, 0x73 (Moblins walking in from the edges) from N leaves E to the D3 entrance. Round 24, the
  leg to Dungeon 5 (docs/routes/d5-leg.md): the clip way''s 0x53, 0x52 E→W and 0x51 E→W by its wrap exit (CLIP E on Y $75-$9D),
  and 0x3d from E (after 0x3e''s wrap) N; the plain way''s 0x5b, 0x5c W→E and 0x5d W→S (`_v2`: the route''s second visit
  from W; 0x5b''s upper opening, 0x5d''s S at X $C0), 0x6d N→E, 0x6e W→E. Each of these is on one way only, so its state
  fixes the switch. Round 27, the leg from Dungeon 7 to the magic sword (route `d6`, docs/routes/d6.md §14; states `0_42c`,
  `0_52n`, `0_51e_v2` (one state, both ways of `woods`), `0_61n`): 0x42 out of Dungeon 7 leaves S, 0x52 N→W, 0x51 E→W by
  its wrap exit again (clips) or E→S (plain), and the Lost Woods 0x61 (`exit: maze`: N, W, S, W). Walked zero-shot with
  the round 25 run: 100% in all of them. Round 28, the leg to Dungeon 8 (route `d8`, docs/routes/d8.md §15; states `0_4dw_v2`,
  `0_5dn`, `0_6dn_v2`): 0x4d W→S, 0x5d N→S by its right opening, and 0x6d N→the stairs under its tree: to a stand tile E
  of the tree on its row (X $B8-$CF), CANDLE W (offered only there, while the tree stands and no fire burns), still while
  the fire burns (walking W at once costs half a heart), then W onto the stairs. Walked: by script 30 of 30; this family
  zero-shot 0x4d 35 of 40, 0x5d 40 of 40, 0x6d 0 of 40. Round 29, the leg to Dungeon 9 (route `d9`; state `0_6dc` on chains
  0-2): 0x6d out of Dungeon 8 (`exit: recorder`): RECORDER once from the spot the game sets Link down on, facing down, then
  wait for the whirlwind: Dungeon 1''s entrance 0x37. Walked: 30 of 30 with the four Moblins live, 0 hearts; this family
  zero-shot 0 of 40.'
