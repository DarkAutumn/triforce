success:
- exit-correct
- triforce-collected
reward_profile: default
reward:
  pbrs: true
  item_targets: true
  heart_value:
    exit: true
    potential: 20
  # Round 40, "The Goriya teacher" (the owner, Nov 26: "Yes to all four"; round40.md): a parried boomerang pays what
  # its hit would cost (1 heart: penalty-lost-health 0.5, penalty-lost-beams 0.25 at full hearts): 0.5 x 1.5 = 0.75, on
  # the room's own count of blocks (on the combat count, a block after 7x1b's first dozen hits paid 1/16 or less) ...
  block_reward: 1.5
  block_own_decay: true
  # ... and an attack that drops the shield with a shot near and no monster near or aimed at costs
  # (zelda::exposed; measured on the overworld recordings before it was switched on, round40.md).
  exposed_attack_penalty: 0.1
obs:
  objective: true
  target: true
ram_randomization:
  hp:
  - 0.15
  - max
  full_hp: 0.5
  bombs:
  - 0
  - 8
  bombs_share: 0.5
  room_kills:
    (7, 0x49):
    - 1
    - 5
    (7, 0x1a):
    - 1
    - 5
    (7, 0x1b):
    - 1
    - 5
  room_kills_share: 0.5
items:
  bombs: free
  food: true
clips:
  enabled: true
  off_share: 0
curriculum:
  enabled: true                           # round 45: every walked door tracked (7x49 by a staged-kill track, Tracks45)
one_room: true
max_steps: 2000
warm_start: null
notes: 'Red Goriya rooms, whatever the dungeon (was split between d1-wallmaster and d2-goriya). Dungeon 1: the 3-Goriya
  room whose boomerang appears when all are dead (Link has no boomerang yet) and the 3-Goriya key room 0x23 north of the
  Stalfos key room, crossed twice on the bow detour (S to W, then W to S; Nov 9). Dungeon 2: the 5-Goriya room and the 5-Goriya
  room whose N shutter opens only once all are dead (N leads into the Dodongo room). Dungeon 7 (round 26; docs/routes/d7.md):
  Blue Goriyas (3 white-sword hits, 1 heart a touch, boomerangs) join the Red. Crossed: the entrance 0x79, 0x69 (5 Blue;
  bomb the N wall), 0x59, 0x38 (the N key door), 0x18 (dark, the ladder; the E key door), 0x19 (bomb the E wall), 0x1a out
  of the candle cellar (bomb the E wall), 0x29 out of the tunnel (bomb the E wall); the Grumble''s 0x28 (FOOD once his text
  has typed); cleared: 0x49 (3 Blue and 3 Keese: the N shutter), 0x1a from W without clips (3 Blue and 3 Red, then the push;
  with clips the block clip N to the stairs and no fight) and 0x1b (6 Blue: its 4 bombs while the bag isn''t full; the E
  key door); the triforce room 0x2b (`triforce-collected`).'
state_routes:
- d3first
