- (7, 0x1b)
- (7, 0x29)
- (7, 0x2b)
start_states:
- 1_44*_[0-9]
- 1_23*_[0-9]
- 2_5e*_[0-9]
- 2_1e*_[0-9]
- 7_79*_[0-9]
- 7_69*_[0-9]
- 7_59*_[0-9]
- 7_49*_[0-9]
