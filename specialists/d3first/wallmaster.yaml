# wallmaster@d3first: the task of the family's run for d3first's wood-sword half (promoted.d3first is
# r34d7-wall-s3), rebuilt (the yaml it trained on lived in its round's worktree, gone): the family's yaml with
# state_routes [d3first] and the run's own terms as its run.json and docs/experiments/round34.md ("Dungeon 7", "The
# trainings") record them: chain_hp 1.0, harvested handoffs at 0.3. The lab reads this file for the key
# f"{family}@d3first" (lab.collect.task_yaml).
name: wallmaster
rooms:
- (1, 0x45)
- (7, 0x0d)
start_states:
- 1_45*_[0-9]
- 7_0d*_[0-9]
success:
- exit-correct
reward_profile: default
reward:
  pbrs: true
  item_targets: true
obs:
  objective: true
  target: true
ram_randomization:
  hp:
  - 0.15
  - max
  full_hp: 0.5
  bombs:
  - 0
  - 8
  bombs_share: 0.5
  help_count:
  - 0
  - 9
  room_kills:
    (7, 0x0d):
    - 1
    - 4
  room_kills_share: 0.5
  chain_hp: 1.0
items:
  bombs: tenth
curriculum:
  enabled: true
harvested_fraction: 0.3
one_room: true
max_steps: 2000
warm_start: null
notes: 'Wallmaster rooms (was the second half of d1-wallmaster). Dungeon 1: 8 Wallmasters, key, exit N through a locked
  door. Wallmaster shaping is applied by the default critic whenever a Wallmaster is present. Dungeon 7 (round 26; docs/routes/d7.md,
  d7-walks.md §7): 0x0d from W, five Wallmasters that come out of the wall only where Link stands by it (a grab carries
  him back to 0x79: an `exit-wrong` and the dungeon again), three Bubbles; the room clear, the block pushed W, the stairs
  in the NE corner down to the tunnel.'
state_routes:
- d3first
