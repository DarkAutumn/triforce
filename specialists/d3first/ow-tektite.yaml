# ow-tektite@d3first: the task of the family's run for d3first's wood-sword half (promoted.d3first is r32d1-tektite),
# rebuilt (the yaml it trained on lived in its round's worktree, gone): the family's yaml with state_routes
# [d3first] and the run's own terms as its run.json and docs/experiments/round32.md ("Arm") record them: harvested
# handoffs at 0.25, no chain_hp. The lab reads this file for the key f"{family}@d3first" (lab.collect.task_yaml).
extends: _generation.yaml                 # the fresh generation's switches (2.0.1.0; round40.md "The generation's tasks")
name: ow-tektite
rooms:
- (0, 0x1a)
- (0, 0x2c)
- (0, 0x2c, cave)
- (0, 0x74)
- (0, 0x76)
- (0, 0x1e)
- (0, 0x0d)
- (0, 0x0c)
- (0, 0x0c, cave)
start_states:
- 0_2c*_[0-9]
- 0_74*_[0-9]
- 0_76*_[0-9]
- 0_0c*_[0-9]
success:
- exit-correct
- enter-room:3:0x7c
reward_profile: default
reward:
  pbrs: true
  heal_targets: true
obs:
  objective: true
  target: true
ram_randomization:
  hp:
  - 0.15
  - max
  full_hp: 0.5
  bombs:
  - 0
  - 8
  bombs_share: 0.5
  help_count:
  - 0
  - 9
items:
  bombs: required
clips: true
one_room: true
max_steps: 600
warm_start: null
notes: 'Tektite rooms (the owner, Nov 8: their jump patterns are their own). 0x1a (Red Tektite x6 and a Zora), crossed twice:
  from E to N (to the white sword at 0x0a), then from N to W; from N without the white sword (a retreat from 0x0a) the objective
  sends Link back N. 0x2c (Red Tektite x4, the owner Nov 8): from E bomb the rock wall and enter the take-any cave, take the heart
  container (right ware; the potion or leaving without it is `missed`), then N out of the room. 0x74 (one Red Tektite; Nov
  9): from W into Dungeon 3''s open entrance (enter-room 3:0x7c); round 22 (the wrap way, clips): also from E, where CLIP
  E''s wrap exit out of 0x75 lands Link at X $F0 inside its tree columns, and 0x76 (four Red Tektites) from E (0x77''s lane)
  leaves W; its rock wall (the money game) is not bombed. Round 24, the leg to Dungeon 5 (docs/routes/d5-leg.md): 0x1e (six
  Red Tektites, a Zora) W→E and E→W; on the mountain''s clip way 0x0d S→W and 0x0c from E W by its wrap exit (CLIP E on
  Y $65-$AD) onto the mountain top; on its plain way 0x2c from E (`0_2ce_v2`) N, its wall open since the heart cave (no
  cheated bomb, BOMB only for the 10th kill). No curriculum: each crossing is a walk or a single CLIP from the arrival.'
curriculum:
  untracked:                              # round 40 (the lead, Nov 24): no curriculum for 0x76; its explored tracks
  - d3first_0_76e_[0-9]                   # walk across and kill (round40.md "Tracks"); the wrap is two actions the
                                          # objective's targets carry
state_routes:
- d3first
harvested_fraction: 0.25
