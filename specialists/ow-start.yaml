name: ow-start
rooms: ['(0, 0x77)', '(0, 0x77, cave)', '(0, 0x1c)', '(0, 0x1b)', '(0, 0x2f)', '(0, 0x2f, cave)', '(0, 0x0f)', '(0, 0x0f, cave)']
start_states: ['start', '0_77*_[0-9]', '0_1c*_[0-9]', '0_1b*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true}
obs: {objective: true, target: true}       # schema 2 pointer, no item targets (round 10 §10, r43)
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
clips: true                               # round 21: the screen wrap (W/E)
max_steps: 1000
warm_start: null
notes: >-
  Rooms without enemies where Link walks to a spot. Start screen + sword cave: the correct exit depends on
  progress (no sword -> cave; in the cave -> S once the sword is taken; with sword -> N, 0x78 E is the tagged
  alternate). 0x1c (from S, leave W) and the mountain maze 0x1b (from E, leave W) after the 0x2c heart cave. Round
  22: 0x77 again on the wrap way to Dungeon 3, from N (out of 0x67) leave W along its open rows (Y $85/$8D).
  Round 24 (route d5maze): 0x1b from E after the D4 triforce leaves by the Lost Hills' sequence (`exit: maze`, N
  four times at X $70); each of the first three Ns loops back into 0x1b and is a correct loop (progress, paid as a
  new room), a wrong edge is exit-wrong. On d2first's 0x1b (leave W) an N loop is exit-wrong too.
