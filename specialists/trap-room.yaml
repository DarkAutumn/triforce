name: trap-room
rooms: ['(1, 0x22)', '(3, 0x5a)', '(3, 0x4c)', '(4, 0x11)', '(4, 0x02)']
start_states: ['1_22*_[0-9]', '3_5a*_[0-9]', '3_4c*_[0-9]', '4_11*_[0-9]', '4_02*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true, item_targets: true}   # as the dungeon families (round 10 §8): dropped items are shaping targets
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chains arrive with partial hearts (round 5)
items: {bombs: required}                   # their requires_bombs rooms (3:0x4c's and 4:0x11's walls; offered only in reach of the wall); else the 10th kill
clips: true                                # round 21: the block clip under 1:0x22's blocks
curriculum: {enabled: true}             # trajectories/trap-room (Go-Explore paths per start state)
one_room: true
max_steps: 600
warm_start: null
notes: >-
  Blade-trap rooms (Lee, Nov 9), whatever the dungeon: traps ($49) that slide at Link when he lines up with them and
  can't be killed. Dungeon 1's 0x22 (the bow detour, docs/routes/d2first.md; no monsters): from E, push the west
  block of the diamond N or S (the objective points at the push spots while it is pending), then take the stairs
  in the middle down to the bow cellar; back from the cellar (Link comes out below the reset block), leave E.
  Dungeon 3 (Nov 9, docs/routes/d3.md): 0x5a (4 Blue Keese, the compass) crossed E to W and back W to E; 0x4c
  (2 Zols, the map) from S (round 22; the two bottom traps charge along the bottom row at once): bomb the E wall (the
  objective points at the spot to bomb it from, facing the wall 16 px short of its hotspot, out of the right-hand
  traps' column) and go through into Manhandla's room. Bombs are on for the family because of 0x4c and 0x11 (a
  cheated bomb if Link has none), offered only where the bomb lands within reach of the route's intact wall (round
  22). Dungeon 4 (Nov 11-12): the rupee room 0x11 (no monsters and no traps, ten rupees, four bombable walls: in
  through the S wall, bomb the N wall into the Keese room 0x01, round 22), the nearest thing to it, a room Link
  crosses through a bomb wall (Lee, Nov 12: it stays here); round 22: the dark 0x02 (six blade traps, no monsters)
  from W leave S into the Vire room 0x12 (level-4.md's recipe: wait in the doorway for the traps to pass).
