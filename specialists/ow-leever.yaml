name: ow-leever
rooms: ['(0, 0x48)', '(0, 0x75)', '(0, 0x0b)']
start_states: ['0_48*_[0-9]', '0_75*_[0-9]', '0_0b*_[0-9]']
success: [exit-correct, enter-room:5:0x76]
reward_profile: default
reward: {pbrs: true}
obs: {objective: true, target: true}       # schema 2 pointer, no item targets (as the overworld families)
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chain arrives with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
clips: true                               # round 21: the screen wrap (W/E; none in 0x48)
curriculum: {enabled: true}             # trajectories/ow-leever (Go-Explore paths per start state)
one_room: true                          # round 5: per-room episodes
max_steps: 600
warm_start: null
notes: >-
  Leever rooms (Nov 9): Leevers burrow and surface next to Link, unlike anything in the other overworld families.
  0x48 (Red Leever x4 and a Zora) is forced on the way from Dungeon 1 (0x37) to Dungeon 3 (0x74): from N (0x38)
  leave S (0x58). Round 22 (the wrap way to Dungeon 3, clips): 0x75 (two Blue and a Red Leever, three Peahats, a
  Zora) from E into its E part, cut off by the river: leave W by CLIP E on a row Y $65-$AD (the wrap exit through its
  solid W edge into 0x74; never offered on the softlock rows). Copied from ow-moblin (one-room, 600 steps,
  curriculum).
  Round 24: 0x0b (one Red Leever, Dungeon 5's entrance at tile (14, 8)) from S out of the Lost Hills (the plain
  mountain way, `0_0bs`: switch off) or from E by 0x0c's wrap exit (the clip way, `0_0be`: switch on): down the
  stairs into 5:0x76 (`enter-room:5:0x76`).
