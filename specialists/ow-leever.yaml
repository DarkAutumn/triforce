name: ow-leever
rooms: ['(0, 0x48)']
start_states: ['0_48*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true}
obs: {objective: true, target: true}       # schema 2 pointer, no item targets (as the overworld families)
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], help_count: [0, 9]}   # chain arrives with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/ow-leever (Go-Explore paths per start state)
one_room: true                          # round 5: per-room episodes
max_steps: 600
warm_start: null
notes: >-
  Leever rooms (Nov 9): Leevers burrow and surface next to Link, unlike anything in the other overworld families.
  0x48 (Red Leever x4 and a Zora) is forced on the way from Dungeon 1 (0x37) to Dungeon 3 (0x74): from N (0x38)
  leave S (0x58). Copied from ow-moblin (one-room, 600 steps, curriculum).
