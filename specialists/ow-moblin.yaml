name: ow-moblin
rooms: ['(0, 0x3d)', '(0, 0x4d)', '(0, 0x5b)', '(0, 0x5c)', '(0, 0x5d)', '(0, 0x63)', '(0, 0x73)']
start_states: ['0_3d*_[0-9]', '0_4d*_[0-9]', '0_5b*_[0-9]', '0_5c*_[0-9]', '0_5d*_[0-9]', '0_63*_[0-9]', '0_73*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true}
obs: {objective: true, target: true}       # schema 2 pointer, no item targets (round 10 §10, r42)
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chain arrives with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/ow-moblin (round 6: the row-5 tree mazes)
one_room: true                          # round 5: per-room episodes
max_steps: 600                        # explored paths are 12-70 steps; 2000-step timeouts starved r24 of episodes
warm_start: null
notes: >-
  Moblin rooms. 0x5b, 0x5c, 0x5d and 0x4d from S on the way to D2; 0x4d from W and 0x3d after it. 0x5b's E
  edge has two openings and only the upper one reaches 0x5c's E exit (game.yaml `span`). On to D3 (Nov 9): 0x63
  (Moblins and slow Octoroks) from E leaves S, 0x73 (Moblins walking in from the edges) from N leaves E to the D3
  entrance.
