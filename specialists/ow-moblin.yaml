name: ow-moblin
rooms: ['(0, 0x3d)', '(0, 0x4d)', '(0, 0x5b)', '(0, 0x5c)', '(0, 0x5d)']
start_states: ['0_3d*_[0-9]', '0_4d*_[0-9]', '0_5b*_[0-9]', '0_5c*_[0-9]', '0_5d*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: on}
obs: {objective: on}
ram_randomization: {hp: [0.15, max], full_hp: 0.5}   # chain arrives with partial hearts (round 5)
items: {bombs: off}
curriculum: {enabled: on}             # trajectories/ow-moblin (round 6: the fairy route's tree mazes)
one_room: on                          # round 5: per-room episodes
max_steps: 600                        # explored paths are 12-70 steps; 2000-step timeouts starved r24 of episodes
warm_start: null
notes: >-
  Moblin rooms. milestone1: 0x3d, 0x4d (from N). milestone1-fairy: 0x5b, 0x5c, 0x5d and 0x4d from S. 0x5b's E
  edge has two openings and only the upper one reaches 0x5c's E exit (game.yaml `span`).
