name: like-like
rooms: ['(4, 0x32)', '(6, 0x1d)', '(9, 0x14)', '(9, 0x51)', '(9, 0x41)', '(9, 0x03)', '(9, 0x56)']
start_states: ['4_32*_[0-9]', '6_1d*_[0-9]', '9_14*_[0-9]', '9_51*_[0-9]', '9_41*_[0-9]', '9_03*_[0-9]', '9_56*_[0-9]']
success: [exit-correct]                    # down the stairs to the ladder cellar; on the way back, W
reward_profile: default
reward: {pbrs: true, item_targets: true, heart_value: {exit: true, potential: 20}}   # dungeon family (round 10 §8): dropped items are shaping targets; round 25: hearts priced by their worth to the run
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
# room_kills (round 29, as wizzrobe's): half the resets into 9:0x14, whose five Like-Likes must die for its exit,
# bank 1-4 of them before the entry, so the game makes fewer (training only; one at least is left).  chain_hp (round
# 29's third round): half the resets into a level 9 room take their hearts from triforce/chain_hp.json (0x41 and
# 0x51 are entered with under four); the other levels' rooms have no profile and keep the hp draw.
ram_randomization: {hp: [0.15, max], full_hp: 0.5, chain_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9],
                    room_kills: {'(9, 0x14)': [1, 4]}, room_kills_share: 0.5}
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
clips: {enabled: true, off_share: 0}       # round 29: the block clip of 9:0x03 to its stairs; the owner, Nov 18: no episode with CLIP masked (the no-clip runs are dropped, 0x03 is not fought)
curriculum:                              # trajectories/like-like (Go-Explore paths per start state)
  enabled: true
  untracked:                              # round 40: the seed states that train without a track (triforce.inputs);
  - d3first_6_1dc_[0-9]                   # the Breakfast Room 4:0x32 has the rule like-like-32's (Tracks41)
  - d3first_9_03e_[0-9]
  - d3first_9_14c_[0-9]
  - d3first_9_41s_[0-9]
  - d3first_9_51s_[0-9]
  - d3first_9_56s_[0-9]
one_room: true
max_steps: 2000
warm_start: null
harvested_fraction: 0.25                  # round 33: chain handoffs at the route's hearts (from 0_6dc_0: 9:0x56 from S 400, 0x14 130, 0x51 66, 0x03 34), triforce/states/harvested/like-like, not in git (docs/experiments/round33.md)
notes: >-
  Like Like rooms (Dungeon 4, Nov 11-12): a Like Like swallows Link and eats his magic shield.
  Dungeon 4's Breakfast Room 0x32 (the owner's name: two Like Likes, two Zols, two Bubbles): in from W, kill the Like
  Likes and Zols (the Bubbles don't count), push the block (any way; it moves only once the room is clear) so the
  stairs appear at tiles (26-27, 4-5), and go down to the ladder cellar 0x60; back up, leave W. Copied from zol
  (one-room, curriculum, 2000 steps).
  Dungeon 6 (round 27, route `d6`; state `6_1dc`): 0x1d (two Like-Likes, two Zols, two Bubbles) out of the
  tunnel's stairs, crossed to the S door without a fight.
  Dungeon 9 (round 29, route `d9`; states `9_14c`, `9_51s`, `9_41s`, `9_03e` on chains 0-2, round29.md §9): the
  spiral 0x14 (five Like-Likes in corridors one square
  wide: fought, `treasure: clear`; a walk through is held in 20 of 20 and loses 4.4 hearts, the sword from range
  0.05), 0x51 (six Like-Likes between rows of blocks, S to N) and the dark 0x41 (four Traps, four Like-Likes,
  straight up; its S shutter never opens again) crossed, and 0x03 (two Zols, two Like-Likes, two Bubbles: the
  Breakfast Room again) emptied for its block and the stairs inside the ring (a rule clears it 20 of 20 at 0.05
  hearts with the ring). Walked zero-shot: `stuck` in every one of them under the round 27 rule (50 decisions in
  one place while held); round 28's rule no longer counts a held Link.
  Round 31 (phase IX, the owner, Nov 19; state `9_56s`): 9:0x56 (two Bubbles, two Zols, two Like-Likes) crossed S
  to its W bomb wall by the bottom row (the route step's `bombs: required`: BOMB at the wall; its key left).
