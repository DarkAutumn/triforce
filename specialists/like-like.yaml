name: like-like
rooms: ['(4, 0x32)', '(6, 0x1d)']
start_states: ['4_32*_[0-9]', '6_1d*_[0-9]']
success: [exit-correct]                    # down the stairs to the ladder cellar; on the way back, W
reward_profile: default
reward: {pbrs: true, item_targets: true, heart_value: {exit: true, potential: 20}}   # dungeon family (round 10 §8): dropped items are shaping targets; round 25: hearts priced by their worth to the run
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chains arrive with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/like-like (Go-Explore paths per start state)
one_room: true
max_steps: 2000
warm_start: null
notes: >-
  Like Like rooms (Dungeon 4, Nov 11-12): a Like Like swallows Link and eats his magic shield.
  Dungeon 4's Breakfast Room 0x32 (Lee's name: two Like Likes, two Zols, two Bubbles): in from W, kill the Like
  Likes and Zols (the Bubbles don't count), push the block (any way; it moves only once the room is clear) so the
  stairs appear at tiles (26-27, 4-5), and go down to the ladder cellar 0x60; back up, leave W. Copied from zol
  (one-room, curriculum, 2000 steps).
  Dungeon 6 (round 27, route `d6`; state `6_1dc`): 0x1d (two Like-Likes, two Zols, two Bubbles) out of the
  tunnel's stairs, crossed to the S door without a fight.
