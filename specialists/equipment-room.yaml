name: equipment-room
rooms: ['(1, 0x7f, cave)', '(3, 0x0f, cave)', '(4, 0x60, cave)', '(5, 0x04, cave)', '(5, 0x07, cave)', '(7, 0x4a, cave)', '(7, 0x7b, cave)', '(6, 0x08, cave)']
start_states: ['1_7f*_[0-9]', '3_0f*_[0-9]', '4_60*_[0-9]', '5_04*_[0-9]', '5_07*_[0-9]', '7_4a*_[0-9]', '7_7b*_[0-9]', '6_08*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true, item_targets: true, heart_value: {exit: true, potential: 20}}   # as the dungeon families (round 10 §8): dropped items are shaping targets; round 25: hearts priced by their worth to the run
obs: {objective: true, target: true}       # schema 2: direction/distance to the nearest target
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # chains arrive with partial hearts (round 5)
items: {bombs: tenth}                      # only the 10th damage-free kill's bomb (arms a forced bomb drop)
curriculum: {enabled: true}             # trajectories/equipment-room (Go-Explore paths per start state)
one_room: true
max_steps: 600
warm_start: null
notes: >-
  Underworld item cellars (Lee, Nov 9: "all equipment rooms are pretty much the same"): side view, walkways joined
  by ladders, four Blue Keese, the item on the upper walkway. Dungeon 1's bow cellar 0x7f under 0x22: Link arrives
  at the top of the left ladder, goes down, along the floor, up the right ladder to the bow, and back up the left
  ladder out to 0x22 (success: the bow, then that exit; leaving without it is a wrong exit). Dungeon 3's raft
  cellar 0x0f under 0x69 (Nov 9): the same with the raft (`waypoint: raft`), back up to 0x69. Dungeon 4 (Nov
  11-12): the ladder cellar 0x60 under the Breakfast Room 0x32 (`waypoint: ladder`). Dungeon 5 (round 24): the
  recorder cellar 0x04 under the Olive Garden 0x05 (`waypoint: recorder`), and the tunnel cellar 0x07 between 0x64
  (the left ladder, game.yaml exit W) and 0x06 (the right one, E), crossed twice: E without the recorder, W with it
  (the step's ladder is the only correct exit).
  Dungeon 6 (round 27, route `d6`; no start state yet): the tunnel 0x08 from 0x3a's stairs (the left ladder) to 0x1d
  (the right one, E); back up the left ladder is a wrong exit into 0x3a with its block back.
