name: boss-gleeok
rooms: ['(4, 0x13)', '(8, 0x3c)']
start_states: ['4_13*_[0-9]', '8_3c*_[0-9]']
success: [exit-correct]                    # kill, take the heart container, leave N to the triforce room 0x03
reward_profile: default
reward: {pbrs: false, item_targets: true}  # The owner, Nov 12 (round 20): no PBRS; it punished dodging the flying heads and fireballs
obs: {objective: true, target: true}       # schema 2
ram_randomization: {hp: [0.5, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}   # The owner, Nov 12: partial starts 3.5-7 hearts (at 1-3 hearts r70 never won)
items: {bombs: never}                     # only the sword hurts Gleeok (invincibility mask $FE, zelda-asm/enemies.md)
curriculum:                              # trajectories/boss-gleeok (Go-Explore paths per start state)
  enabled: true                           # round 45: d3first's walked 8x3c tracked too (Tracks45)
# Round 30 (round30.md): a third of the resets from the chains' handoffs into 4:0x13 and 8:0x3c (triforce/states/
# harvested/boss-gleeok, not in git: `eval-chain --from 4_71s_0 --stop-at step:133` and `--from 8_7es_0 --stop-at
# step:296`, 300 runs each, `--first-seed 5000 --harvest DIR`), at the hearts the runs bring: a harvested start keeps
# them, below the `hp` draw's half when the run brings less.
harvested_fraction: 0.33
one_room: true
max_steps: 1000
warm_start: null
notes: >-
  Gleeok (Dungeon 4, Nov 11-12): the two-headed one (object $43), a body at the top of the room with two necks; only
  the heads take damage (they share one HP byte, slot 5's), a head that is cut off flies around the room and can't
  be hurt, and both spit fireballs. The env observes the attached heads as synthetic enemies (id $42 in slots 2+n)
  and treats the body and the flying heads as hazards: only head damage pays. Entered from W through 0x12's shutter
  (opened by its push block); the N and W shutters open and the heart container appears when he dies; success is
  the N exit to the triforce room (the heart first). Copied from boss-manhandla without the bombs.
  Dungeon 8 (round 28, route `d8`; docs/routes/d8.md §15, d8-walks.md §6; state `8_3cs`): Gleeok with four
  heads in 0x3c, entered through the bombed S wall. 3 + 2 + 2 + 2 magic sword hits, 36 frames apart at best; up to
  three flying heads (1 heart, cannot be hurt); one fireball at a time (1 heart). The attached heads never reach row
  Y $9D or lower, where the blade still reaches them. A retreat S resets the fight. Then the heart container (14)
  and the N shutter. Walked zero-shot: 0 of 20; a script on row Y $9D wins 30 of 30 from 13 hearts, 26 of 30 from 6
  (its rule through the env's actions: scripts/experiments/r28_demos.py gleeok, 29 of 30 from 13, 17 of 30 from 6).
