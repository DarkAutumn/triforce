notes: >-
  Rooms whose enemies are Stalfos, Keese and Gels (was d1-melee): Dungeon 1's route rooms plus the empty entrance
  hall and the triforce room (ends on pickup), including the Stalfos key room 0x33 north of the Gel map room,
  crossed twice on the bow detour (S to N, then N to S; Nov 9). Start states are pre-entry states from
  triforce/entry_states.py. Dungeon 4 (Nov 11-12): its Keese room 0x51 (eight Blue Keese, the key in the open from
  the start: take it, S to W) and its dark Gel room 0x21 (five Blue Gels: W in, or S onto its island and the ladder
  clip N; bomb the N wall into the rupee room: BOMB is offered only where the bomb opens it). Round 22: the dark
  Keese room 0x01 (eight Blue Keese over water) S in through the wall bombed from 0x11, take the key in the middle
  (the ladder crosses one water square), E out across the single square at X $B0.
  Dungeon 6 (round 27, route `d6`; states `6_79s`, `6_58s`, `6_0cs`): the empty entrance 0x79 (S to its W key door),
  0x58 (eight
  Blue Keese and four statues that shoot: kill them for the key and the N shutter; walked zero-shot 40 of 40, 1.8
  hearts lost) and the triforce room 0x0c.
  Dungeon 8 (round 28, route `d8`; states `8_7es`, `8_2cs`): the empty entrance 0x7e (S to N; its statues do not
  shoot) and the triforce room 0x2c; walked zero-shot 40 of 40 each.
  Dungeon 9 (round 29, route `d9`; states `9_76s`, `9_66s`, `9_26n`, `9_26e`, `9_06s`, `9_62e` on chains 0-2,
  round29.md §9): the empty entrance 0x76; 0x66 (the old man is gone with
  eight pieces, S to W along Y $8D under its two fires; with fewer pieces the route is `missed`); 0x26 (eight Gels)
  N to its E bomb wall and, on the way back from the ring, E to N (its rupees left, its S and W key doors masked);
  the old man's 0x06 from its S key door to its W bomb wall (Link is halted 134 frames by the text; SWORD and BEAMS
  are masked: a fourth hit makes two fireballs that stay); 0x62 (eight Keese) E to W. Walked zero-shot 34-40 of 40.
