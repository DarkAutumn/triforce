clips: true                               # round 21: 0x21 from S, the ladder clip N off the island
one_room: true                          # an episode is one room (round 4)
max_steps: 3000
warm_start: null
notes: >-
  Rooms whose enemies are Stalfos, Keese and Gels (was d1-melee): Dungeon 1's route rooms plus the empty entrance
  hall and the triforce room (ends on pickup), including the Stalfos key room 0x33 north of the Gel map room,
  crossed twice on the bow detour (S to N, then N to S; Nov 9). Start states are pre-entry states from
  triforce/entry_states.py. Dungeon 4 (Nov 11-12): its Keese room 0x51 (eight Blue Keese, the key in the open from
  the start: take it, S to W) and its dark Gel room 0x21 (five Blue Gels: W in, bomb the N wall into the rupee
  room).
