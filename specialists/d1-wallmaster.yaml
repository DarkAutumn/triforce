name: d1-wallmaster
rooms: ['(1, 0x44)', '(1, 0x45)']
start_states: ['1_44*_[0-9]', '1_45*_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: on}
obs: {objective: on}
ram_randomization: {hp: [0.15, max], full_hp: 0.5}   # chain arrives with 0.5-1.5 hearts; [0.15, 0.5] collapsed (r11, round 5)
items: {bombs: off}
curriculum: {enabled: on}             # trajectories/d1-wallmaster (round 2: 18% -> 87%)
one_room: on                          # round 5: 0x44 episodes end on entering 0x45 (0x44 is the chain's death room)
max_steps: 2000
warm_start: null
notes: >-
  0x45 exits N through a locked door. Wallmaster shaping is applied by the default critic whenever a Wallmaster
  is present.
