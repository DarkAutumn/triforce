notes: >-
  Overworld route rooms whose main threat is the single Zora and its fireball, alongside Peahats (0x27, 0x28,
  0x59) and Octoroks (0x38, 0x2d, 0x5a, 0x55, 0x56, 0x65). 0x59, 0x5a on the way to D2; 0x2d after it; 0x27, 0x28,
  0x38 on the way to D1; on to D3 0x38 from W leaves S, and (round 22, without clips) 0x65 from E leaves W across
  its one ford (Y $85/$8D); on to D4 0x65 from W leaves N and 0x55 (the raft dock; its W third is walled off) from S
  leaves N. Round 24, the leg to Dungeon 5 (docs/routes/d5-leg.md): 0x55 from N (off the raft) leaves W by its wrap
  over the river (clips) or E (plain); 0x54 E→W and 0x5f from E (on the water after 0x60's wrap: the ladder clip W
  to the heart container, N) on the clip way only; 0x56, 0x59 and 0x5a W→E, 0x6f W→N and 0x5f from S (the plain
  ladder to the heart container, N) on the plain way only; the shared 0x4f S→N, 0x3f S→N (the raft up) and N→W;
  0x3e from E W by its wrap exit (clips) or N (plain); 0x2d S→N (clips, `0_2ds_v2`), 0x2e S→W, 0x2d E→N and N→W
  (plain). States the route enters on one way only fix the switch.
  Round 29, the leg to Dungeon 9 (route `d9`, docs/routes/d9.md "as built"; seven states on chains 0-2, round29.md
  §9): 0x38 W→S and S→N,
  0x28 S→W, 0x27 E→N (walked zero-shot 36-40 of 40, under half a heart each) and 0x47 (one Zora; a strip two squares
  high): from E to a tile of the tree's column above it (X $A8-$B7, Y $8D-$9D), CANDLE S (offered only there, while
  the tree stands and no fire burns; the stairs show 94 frames later), down the stairs, the take-any cave's right
  ware (`waypoint: heart`: 15 containers; the left one is a potion and leaves no container: `missed`), out, E.
