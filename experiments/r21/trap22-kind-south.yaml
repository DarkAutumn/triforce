name: trap22-kind-south
# Round 21, the block clip in level 1 room 0x22 (docs/experiments/round21-trap-room.md). Modelled on
# specialists/trap-room.yaml with only 0x22 from E; the arms differ only in `clips.action` and the curriculum.
# States: experiments/r21/states (TRIFORCE_STATES_DIR=experiments/r21/states); run from the repository root,
# curriculum tracks are rebuilt by scripts/experiments/r21_trap_room.sh.
rooms: ['(1, 0x22)']
start_states: ['1_22e_[0-9]']
success: [exit-correct]
reward_profile: default
reward: {pbrs: true, item_targets: true}
obs: {objective: true, target: true}
ram_randomization: {hp: [0.15, max], full_hp: 0.5, bombs: [0, 8], bombs_share: 0.5, help_count: [0, 9]}
items: {bombs: required}
curriculum: {enabled: true, trajectories: trajectories/r21-trap22-south}
clips: {action: kind, shaping: jump}
one_room: true
max_steps: 600
warm_start: null
