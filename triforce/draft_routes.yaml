# Draft routes: planned, not played (triforce/draft_routes.py; zelda-map.py --route NAME draws them).
# Nothing but the map reads this file: routes.yaml stays the route the models play.  A step is a routes.yaml step
# (level, room, in_cave, entry, exit) and may have `note` (what Link does there), `leg` (the part of the route it
# starts), `wrap: true` (a screen wrap in this room; required to leave through a game.yaml wrap exit, e.g. 0x60 W
# into 0x5f), `takes` (what Link takes in the room's overworld cave), `exit: recorder` / `entry: recorder` (the
# whirlwind), `exit: maze` (out of a maze room by its sequence) and `exit: end`.  A `stretch:` block holds the clip
# way and the plain way where they differ, as in routes.yaml: the map's Clips selector shows one or both.
#
# No draft is left.  first-quest (Nov 13-14; docs/routes/first-quest.md) was d2first, then the rest of the first
# quest: the overworld legs and their plain ways (the owner, Nov 13-14), the dungeon paths with the keys the route finds,
# without level 6's wand and level 8's book and magic key, level 9 with the red ring; bombs only from the rooms and
# drops on the way.  Its parts moved into routes.yaml as they were built: round 24 the leg from Dungeon 4 and Dungeon
# 5, round 26 the leg from Dungeon 5 and Dungeon 7, round 27 the magic sword and Dungeon 6, rounds 28 and 29 (merged at
# 1.9.0.0) Dungeon 8, Dungeon 9, Ganon and Zelda: d2first runs from the game start to the end of the game.  A draft
# is `NAME: {extends: <routes.yaml route>, steps: [...]}`.
