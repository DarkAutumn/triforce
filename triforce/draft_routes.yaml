# Draft routes: planned, not played (triforce/draft_routes.py; zelda-map.py --route NAME draws them).
# Nothing but the map reads this file: routes.yaml stays the route the models play.  A step is a routes.yaml step
# (level, room, in_cave, entry, exit) and may have `note` (what Link does there), `leg` (the part of the route it
# starts), `wrap: true` (a screen wrap in this room; with an `exit: W` game.yaml doesn't have: the wrap exit into
# room - 1), `exit: recorder` / `entry: recorder` (the whirlwind) and `exit: end`.  An overworld cave is not a step
# of its own here: the room's note says what Link takes or buys in it.
#
# first-quest (Nov 13): d2first, then the rest of the first quest.  The overworld legs are Lee's (Nov 13); the
# dungeon paths are the "Route" sections of zelda-asm/levels/level-5.md .. level-9.md (from the ROM, not walked),
# shortened where carried keys allow (Lee, Nov 13: use them) and without the items the game doesn't need (level 6's
# wand, level 8's book and magic key); level 9 takes the red ring (Lee, Nov 13).  Order: 5, 7, the magic sword, 6,
# 8, 9.  Heart containers on entering a dungeon: 5 with 10, 7 with 11, 6 with 12, 8 with 13, 9 with 15.
