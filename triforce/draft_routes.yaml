# Draft routes: planned, not played (triforce/draft_routes.py; zelda-map.py --route NAME draws them).
# Nothing but the map reads this file: routes.yaml stays the route the models play.  A step is a routes.yaml step
# (level, room, in_cave, entry, exit) and may have `note` (what Link does there), `leg` (the part of the route it
# starts), `wrap: true` (a screen wrap in this room; required to leave through a game.yaml wrap exit, e.g. 0x60 W
# into 0x5f), `takes` (what Link takes in the room's overworld cave), `exit: recorder` / `entry: recorder` (the
# whirlwind), `exit: maze` (out of a maze room by its sequence) and `exit: end`.  A `stretch:` block holds the clip
# way and the plain way where they differ, as in routes.yaml: the map's Clips selector shows one or both.
#
# first-quest (Nov 13-14): d2first, then the rest of the first quest.  The overworld legs are Lee's (Nov 13), their
# plain ways (clips off) Lee's (Nov 14: the same heart containers, the recorder allowed).  The dungeon paths are the
# shortest through game.yaml that take what the game needs, with the keys the route finds (Lee, Nov 14: take them;
# a cheated key ends no run but the aim is a run with no cheats), without level 6's wand and level 8's book and
# magic key; level 9 takes the red ring.  Order: 5, 7, the magic sword, 6, 8, 9.  Bombs come only from the rooms and
# drops on the way (Lee, Nov 14: no shop; this is the speedrun route): 5:0x65's Gibdo, 7:0x1b when the bag isn't
# full, 9:0x16's Patra; anything short is a cheated bomb for now.  Every step was walked in the emulator (fights
# skipped; docs/routes/first-quest.md); the plain ways of the overworld legs on Nov 14.
