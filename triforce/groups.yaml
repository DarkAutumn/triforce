# The fresh generation's teachers (2.0.1.0; docs/lab.md "Groups of families"): each one network trained on its
# members' tasks at once, from scratch, on the route's states alone:
#     python -m triforce.lab.train --name NAME --group TEACHER ...
# (``triforce.lab.groups``: the expansion is ``--families <members> --state-route <route>``).
#
# A member is a policy key ``family@route``: its task is ``specialists/<route>/<family>.yaml`` where there is one, else
# the family's own yaml (``lab.collect.task_yaml``). ``shares`` (optional): env shares by member (``--shares``; default
# equal; ``--shares`` on the command line overrides one). Every family the route's steps name is in exactly one teacher
# (tests/test_lab_groups.py). A teacher's name never holds ``+`` (a team spec splits on it).
route: d3first
# The network every teacher trains (the owner, Nov 24: 768 wide everywhere; the lead's pins): `--group NAME` alone
# trains it. A teacher may override a key with its own `network:` (an `arch_config` key by key); a command-line
# `--arch`, `--arch-config` (by key), `--aux` or `--try-others` overrides the file, and the run's log says which.
network:
  arch: hitnet
  arch_config: {tokens: [type, features, rel, threat, chase], feed: true, room: true, hidden_dim: 768}
  aux: [hit=hit:0.5]
  try_others: "4:0.25"
teachers:
  overworld:
    members: [ow-start@d3first, ow-tektite@d3first, ow-leever@d3first, ow-moblin@d3first, ow-octorok@d3first,
      ow-zora@d3first, ow-peahat@d3first, ow-lynel@d3first, ow-ghini@d3first, ow-boulder@d3first]
  walkers:
    members: [gibdo@d3first, stalfos-keese-gel@d3first, zol@d3first, like-like@d3first, vire@d3first,
      goriya@d3first, d2-rope@d3first, dodongo-crossing@d3first, moldorm@d3first]
  # Darknuts alone, as a boss is (the owner's question and the lead's decision, Nov 24-25; round40.md "Darknuts
  # their own teacher"): in the walkers' group their eighteen room entries shared two games of twenty, and the hard
  # rooms (3:0x59 from N, the Olive Garden, 3:0x5b's last pass) got about 800 attempts each in 15.6M steps.
  darknut:
    members: [darknut@d3first]
  others:
    members: [wizzrobe@d3first, pols-voice@d3first, wallmaster@d3first, lanmola@d3first, patra@d3first]
  rooms:
    members: [equipment-room@d3first, trap-room@d3first]
  # The bosses: one teacher each (no head-per-boss network is built).
  boss-manhandla:
    members: [boss-manhandla@d3first]
  boss-gleeok:
    members: [boss-gleeok@d3first]
  boss-aquamentus:
    members: [boss-aquamentus@d3first]
  boss-dodongo:
    members: [boss-dodongo@d3first]
  boss-digdogger:
    members: [boss-digdogger@d3first]
  boss-gohma:
    members: [boss-gohma@d3first]
  ganon:
    members: [ganon@d3first]
