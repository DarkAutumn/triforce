# Solved rooms: the owner's human-perfect ways through rooms of the route (the owner, Nov 25: "a human-perfect way
# through that works every time"; "There aren't a ton of solved rooms, but there definitely are plenty").
#
# What this file is for (the owner, Nov 25): "We aren't going to change the trainers or this run. However, we are
# going to compare at the end of this full retraining if the agents learned the 'Solved' route or not." It is read
# by the comparison (`triforce solved compare`, triforce/solved_rooms.py) and by nothing that trains: no reward,
# task, demonstration or route step reads it unless the owner says so. docs/owner/solved-rooms.md is the page for
# him; AGENTS.md "The owner's standing rules" has the rule.
#
# Rules of the file:
# - **No cellar is ever solved** (the owner, Nov 25: "no cellar is solved because the bats move around"): a cellar
#   or cave is never an entry (the loader refuses one), and the comparison never scores one.
# - An entry is a room and the side it is entered by (`key`: `<room>-<side>`, the owner's notation, `5x47-S`;
#   `cave` is up a stair or out of a cave), on a route step that crosses it that way (`route`, `step`; a test checks
#   it).
# - `description` is the lead's account, from the owner's words (`owner`, quoted whole with their date) and from his
#   takes read frame by frame. Positions are Link's (`$70`, `$84`: the top-left pixel of his 16x16 sprite); a tile
#   is 8 pixels; a dungeon room's floor rows, from the top, are at Y $5D, $6D, $7D, $8D, $9D, $AD, $BD.
# - `conditions.layout`: the spawn cycle `$524` the room is entered with (where its monsters stand,
#   asm:Spawn_AssignPositions; docs/decisions.md 2026-11-25 "Only real starts"). `route` is the value the route
#   brings to the door (triforce/entry_rule.d3first.json `planned`); `claimed_for` says whether the solved way is
#   claimed for that layout (`route`) or for any (`all`). Each take says its own.
# - `phases`: the game's answer to "does it hold every time": scripted inputs over 3000 random phases in the route's
#   layout, both chase states (`$60`, drawn 50/50), loaded by the round-43 load rule (`LiveGame.load(...,
#   layout='route')`, on r40-int); `scripts/solved_phases.py ROOM` repeats it. "clean" = out by the solved exit
#   with no hit.
# - `criteria`: what a pass must do to count as the solved way (triforce/solved_rooms.py "the criteria"); the
#   owner's takes must meet them (tests/test_solved_rooms.py).
# - `takes`: paths relative to the repository (replays/owner/, scripts/owner_takes.py).

