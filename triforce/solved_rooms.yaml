    path through your way in the room's topmost row, and the one under that". The way through is the sword at
    them, not a dodge: a Gibdo has no shield, a hit knocks it back and makes it flash for about 32 frames, and
    while it flashes the game tests neither Link's weapons nor its touch on Link
