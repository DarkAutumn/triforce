# Defines action spaces which can be used when training.  Note that all-items is intended to be all items in the game
# but in practice it defines all of the items that the model is capable of being trained on (due to implementation
# limitations)
action-spaces:
  move-only:
    actions:
    - MOVE
  sword-only:
    default: true
    actions:
    - MOVE
    - SWORD
    - BEAMS
  all-items:
    actions:
    - MOVE
    - SWORD
    - BEAMS
    - BOMBS
    - BOOMERANG

# The kinds of models we are capable of being trained on.  These are neural network classes defined in triforce.
# The ImpalaMultiHeadAgent is currently where work is going into.
model-kinds:
  shared-nature:
    class: SharedNatureAgent
  multihead:
    class: MultiHeadAgent
  impala-shared:
    class: ImpalaSharedAgent
  impala-multihead:
    default: true
    class: ImpalaMultiHeadAgent

# Modifiers
modifiers:
  - has-sword:
      per-reset:
        sword: 1
  - has-boomerang:
      per-reset:
        regular_boomerang: 1

  - four-keys:
      per-reset:
        keys: 4

  - starting-bombs:
      per-reset:
        bombs: 8
  - starting-arrows:
      per-reset:
        arrows: 1
        bow: 1
        rupees: 10

  - infinite-bombs:
      per-step:
        bombs: 4
  - infinite-arrows:
      per-reset:
        arrows: 1
        bow: 1
      per-step:
        rupees: 10

  - all-equipment:
      per-reset:
        regular_boomerang: 1
        sword: 1
        magic_rod: 1
        bow: 1
        arrows: 1
        candle: 1


# Defines training circuits
training-circuits:

# Teaches the agent to play the full game, combining all relevant training scenarios.  This is used for unrestricted
# action spaces that don't limit to just moving or sword-only.
- name: main-circuit
  scenarios:
  - circuit: room-walk-circuit
    iterations: 1000000

  - scenario: overworld-sword
    exit-criteria:
      metric: success-rate
      threshold: 0.8
    iterations: 500000

  - circuit: overworld-dungeon1-unrestricted-items
    exit-criteria:
      metric: success-rate
      threshold: 0.8
    iterations: 2000000

  - circuit: dungeon1-unrestricted-items
    exit-criteria:
      metric: success-rate
      threshold: 0.8
    iterations: 2000000

  # make sure we didn't forget how to navigate to dungeon1 with only a sword after all the item training
  - scenario: overworld-skip-sword
    exit-criteria:
      metric: success-rate
      threshold: 0.9
    iterations: 500000

  - scenario: dungeon1-dungeon2
    exit-criteria:
      metric: success-rate
      threshold: 0.8
    iterations: 1000000

  - scenario: full-game
    exit-criteria:
      metric: success-rate
      threshold: 0.9
    iterations: 500000
    
# Teaches the agent to walk rooms in the overworld and dungeon 1 with all items and infinite bombs/arrows.  The goal
# is to teach the model to either fight for tresasure, or follow the objective arrows to move to the right location.
# This is the starting point for the curriculum that needs to be mastered before moving on to actually moving through
# the world.  This can be used on any action space since items it can't use will be restricted.
- name: room-walk-circuit
  iterations: 2000000
  exit-criteria:
    metric: room-result/correct-exit
    threshold: 0.8
  modifiers:
  - all-equipment
  - infinite-bombs
  - infinite-arrows
  kind: weighted
  scenarios:
  - scenario: overworld-room-walk
    weight: 1
  - scenario: dungeon1-room-walk
    weight: 1

# Teaches the agent to move from after grabbing the sword to the entrance of dungeon1, with an empahsis on using items
# freely (mixing some sword-only and finite items).
- name: overworld-dungeon1-unrestricted-items
  exit-criteria:
    metric: success-rate
    threshold: 0.9

  # Sword-only 40% of the time
  kind: weighted
  scenarios:
  - scenario: overworld-skip-sword
    weight: 40
    modifiers:
  - scenario: overworld-skip-sword
    weight: 30
    modifiers:
    - all-equipment
    - infinite-bombs
    - infinite-arrows
  - scenario: overworld-skip-sword-finite-bombs
    weight: 30
    modifiers:
    - all-equipment
    - starting-bombs
    - starting-arrows

# Teaches the agent to move from after grabbing the sword to the entrance of dungeon1, with an empahsis on using items
# freely (mixing some sword-only and finite items).
- name: dungeon1-unrestricted-items
  exit-criteria:
    metric: success-rate
    threshold: 0.9

  # Sword-only 40% of the time
  kind: weighted
  scenarios:
  - scenario: dungeon1
    weight: 40
    modifiers:
  - scenario: dungeon1
    weight: 30
    modifiers:
    - all-equipment
    - infinite-bombs
    - infinite-arrows
  - scenario: dungeon1
    weight: 30
    modifiers:
    - all-equipment
    - starting-bombs
    - starting-arrows

  - scenario: dungeon1-wallmaster-finite-bombs
    iterations: 250000
    exit-criteria:
      metric: success-rate
      threshold: 0.8
    condition:
      metric: endings/failure-wallmastered
      threshold: 0.5
      cooldown: 100000


scenarios:
# Runs the entire game from the start up to the point where we are capable of training (currently entering dungeon 2).
# This is intended as the main inference scenario when evaluating the model's performance.
- name: full-game
  iterations: 2000000
  end-conditions:
  - EnteredDungeon2
  - Timeout
  metrics:
  - success-rate
  - game-progress
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 0_77c

# Training scenario to teach the model how to pick up the sword and navigate the overworld with it.
- name: overworld-sword
  iterations: 2000000
  end-conditions:
  - StartingRoomConditions
  - Timeout
  metrics:
  - success-rate
  - overworld-progress
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 0_77c
  use-hints: true

# Training scenario to teach the model to navigate to dungeon 1 after the sword has been obtained.
- name: overworld-skip-sword
  iterations: 2500000
  objective:
    kind: ReachLocation
    level: 1
    location: '0x73'
  end-conditions:
  - StartingSwordCondition
  - EnteredDungeon
  - ReachedLocation
  - Timeout
  metrics:
  - success-rate
  - room-result
  - room-health
  - ending
  - game-progress
  - reward-average
  - reward-details
  start:
  - 0_67s
  use-hints: true
  modifiers:
  - has-sword

# Teach the model to navigate from the exit of dungeon1 to the entrance of dungeon 2.
- name: dungeon1-dungeon2
  iterations: 2000000
  scenario_selector: round-robin
  objective:
    kind: ReachLocation
    level: 2
    location: '0x77'
    in_cave: true
  end_conditions:
  - LeftOverworld2Area
  - EnteredDungeon
  - Timeout
  metrics:
  - success-rate
  - overworld-progress
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 0_37c
  modifiers:
   - has-boomerang

# From the entrance of dungeon 1 to gaining the triforce.
- name: dungeon1
  description: Dungeon 1.
  iterations: 10000000
  scenario-selector: round-robin
  objective:
    kind: TreasureObjective
    treasure: triforce
  end-conditions:
  - LeftDungeon
  - GainedTriforce
  - CollectedTreasure
  - Timeout
  - Dungeon1DidntGetKey
  - NowhereToGoCondition
  metrics:
  - success-rate
  - overworld-progress
  - game-progress
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 1_73s

# Dungeon 1 but starts from the keese room just west of the entrance room.  This is sometimes used because the opening
# of dungeon 1 is suprisingly difficult for the model to learn sometimes.
- name: dungeon1-skip-opening
  iterations: 5000000
  objective:
    kind: TreasureObjective
    treasure: triforce
  end-conditions:
  - LeftDungeon
  - GainedTriforce
  - CollectedTreasure
  - Timeout
  - NowhereToGoCondition
  - LeftPlayArea
  metrics:
  - room-result
  - success-rate
  - dungeon1-progress
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 1_63s
  use-hints: true

# Dungeon1 but starts at the wallmaster room with the objective of getting the triforce. This is intended to teach the
# model how to deal with wallmasters while still having a clear objective and reward signal.
- name: dungeon1-wallmaster
  iterations: 2000000
  objective:
    kind: TreasureObjective
    treasure: triforce
  end-conditions:
  - LeftDungeon
  - GainedTriforce
  - CollectedTreasure
  - Timeout
  - LeftWallmasterRoom
  metrics:
  - success-rate
  - overworld-progress
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 1_45w

# Teach the model to navigate the overworld and follow objective arrows.
- name: overworld-room-walk
  iterations: 2000000
  scenario-selector: probabilistic
  objective:
    kind: RoomWalk
  end-conditions:
  - RoomWalkCondition
  metrics:
  - success-rate
  - room-result
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - 0_58
  - 0_68
  use-hints: false
  modifiers:
  - has-sword

# Teaches the model to navigate the rooms of dungeon 1 and follow objective arrows/find treasure.
- name: dungeon1-room-walk
  description: Dungeon 1 room walk.
  iterations: 5000000
  scenario-selector: probabilistic
  objective:
    kind: RoomWalk
  end-conditions:
  - RoomWalkCondition
  - GainedTriforce
  metrics:
  - success-rate
  - room-result
  - room-health
  - ending
  - reward-average
  - reward-details
  start:
  - '1_23'
  - '1_33'
  - '1_42'
  - '1_43'
  - '1_44'
  - '1_35'
  - '1_36'
  - '1_72'
  - '1_74'
  - '1_63'
  - '1_52'
  - '1_53'
  modifiers:
  - four-keys
  