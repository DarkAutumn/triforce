# --- Overworld (level 0): every room 0x00-0x7f (mapping, Nov 9; docs/routes/overworld.md) ---
# Exits: Link walked out of every 8px lane of every edge in the emulator (room-id retarget, Link teleported
# to the first spot inside the edge he fits, walking straight out).  Enemies: the ROM room list (attr C/D +
# LevelInfo FoeCounts, asm:Room_EnterCommon) plus Zora when attr A bit 3 is set; existing entries keep their data.
# `entrance`: the cave index (attr B >> 2), what is inside (OW block E wares/prices, asm:Cave_Init_SetUpTextAndWares) and how it
# opens (open mouth, bomb/burn/push tile object, armos, recorder); every entrance was walked into in the
