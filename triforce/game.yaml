# --- Dungeon 3 (level 3) (mapping, Nov 9; docs/routes/d3.md) ---
# Rooms: LevelInfoUW3 SubmenuMapMask (rotation $0C) over LevelBlockUW1Q1; doors from attr A/B (N A>>5, S A>>2,
# W B>>5, E B>>2; 0 open, 1 wall, 4 bomb, 5/6 key, 7 shutter), enemies from attr C/D + FoeCounts, item from
# attr E & $1F, `trigger` from attr F & 7 (Z_05 CheckSecretTrigger).  Every room was loaded in the emulator
# (room-id retarget from 0x7c) and Lee's route was walked there (docs/routes/d3.md).  Bomb walls are exits
# here (marked `# bomb wall`, also in `bomb_walls`): the boss room's only open way in is 0x4c's E wall.
- level: 3
  location: '0x2a'
  exits:
    E:  # shutter
      level: 3
      location: '0x2b'
  enemies:
    BlueKeese: 8
  treasure: key
  trigger: kill-all  # attr F & 7 = 1
- level: 3
