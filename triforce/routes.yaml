# The owner's bomb rules (round 37, Nov 22; docs/routes/d3first.md "Bombs"), by route.  A route not named here plays
# none (every room by the family's `items: {bombs:}` mode and its step's `bombs:`).  `d2first` is in scope for them
# when its own work comes (the owner: "not until we've completed this work on d3-first, entirely"): the same entry
# under its name switches them on there.
# `wall_only: [{level, room}, ...]`: the rooms where the owner forbids bombs but to progress ("no bomb usage except
# to progress, not to fight"): BOMB is no weapon there, a fight or not, whatever the family's mode or the step's
# (capped at `required`); the bomb that opens the wall the step leaves through and the 10th damage-free kill's (its
# bomb kill arms a forced drop of four: always allowed, the owner) are the only ones.  3:0x5b: crossed S to N with
# no bomb at all (its first pass leaves by no wall); on its last pass (W to E) its Darknuts are fought by the sword
# for the room's bombs, then its E wall is bombed (the step's `bomb_reserve: 0`, d2first's, bites no more there:
# `required` keeps no reserve).
# `treasure_below: N`: the floor under which the route fights for a room's bombs (the owner's blanket rule: "he
# should fight the darknuts if he has 7 or less bombs [...] This is a blanket rule not for this room"): every step
# whose room's game.yaml treasure is bombs and that takes it (no `treasure:`, or `{if_bombs_below: M}`, whose M gives
# way) fights for it when Link comes in holding fewer than N (then while he holds fewer), and crosses with N or more
# (a bomb spent in the room turns no crossing into a fight).  `skip`, `refuse` and `clear` stay the step's.  On
# d3first, 8 (the bag): 3:0x4a, 3:0x5b's last pass, 2:0x1e, 5:0x65 eastbound, 7:0x1b, 8:0x3f, 9:0x16 northbound.
# `treasure_below_rooms: [{level, room, below: N}, ...]`: a room's own floor instead (the override for a room where
# the fight costs too much; 7:0x1b's crossing would be `{level: 7, room: '0x1b', below: 2}`).
# `fights_only: true`: in a dungeon BOMB is a weapon only while the objective fights the room (the owner: "In
# dungeons, link should only use bombs in rooms it somehow needs to clear"): a shutter the monsters hold on the step's
# exit, a treasure or a block that waits on the kills and the step takes, a boss.  Where the route only crosses
# (3:0x69: "slide past the darknuts to get the raft"), or once the fight is over, the family's mode is capped at
# `required` (a `free` family: the wall the step leaves through and the 10th kill's bomb; `tenth`, `required` and
# `never` place no weapon bomb already).  In a fight the family's mode and the reserve stand as before, but in a
# `wall_only` room.  The overworld is untouched.
bomb_rules:
  d3first:
    fights_only: true
    wall_only: [{level: 3, room: '0x5b'}]
    treasure_below: 8
    # 7:0x1b both ways (round 37, d7 from 7_79s_0, 1000 runs, seeds 0-999; runs bring 0.21 bombs, so nearly every
    # visit is a fight either way): the blanket floor (as landed) 12.6% to the triforce, 701 of 733 entering 0x1b
    # lost per 1000, hearts 3.59 in, 1.30 out, 4.16 bombs out of it; with the line below 12.7%, 685, 3.59 / 1.29, 3.99;
    # walls cheated later a run 7:0x1a 0.754 both, 6:0x28 0.024 / 0.027.  Uncomment to cross it with 2 or more:
    # treasure_below_rooms: [{level: 7, room: '0x1b', below: 2}]
