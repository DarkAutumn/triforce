# The route (docs/routes/d2first.md; Lee, Nov 8: the only route; the bow detour and Dungeon 3, Nov 9).
# entry = side of the room Link enters from (start = game start, cave = emerging from a cave/dungeon stairs/cellar or
# the triforce's warp); exit = direction Link leaves (cave = enter the cave, dungeon stairs or cellar stairs in this
# room; triforce = level ends on pickup, asm:Item_Take -> GameMode $12 -> OW; terminal = the route ends on entering
# this room; a route without a terminal step ends on its last step's triforce).  An exit through an intact bomb wall
# (game.yaml `bomb_walls`) sends Link to the spot to bomb it from.
# The objective follows the steps: in a room the route enters from the side Link came in, with the triforce pieces,
# sword, bow, raft and ladder the route has there, the step's exit is the correct one (zelda::objectives).
# `waypoint: heart` (cave step): take the cave's heart container; leaving its room without it is `missed`.
# `waypoint: bow` / `raft` / `ladder` (cellar step): take the cellar's item; until then the objective leads back to it.
# A route is a list of steps, or `{extends: <a route above>, steps: [...]}`: that route's steps, then these.
# An exit that is a game.yaml raft crossing (`raft_exits`) sends Link to its dock; the raft does the rest.
# `retreat: S`: leaving through that exit instead ends a one-room episode as `retreat` (neutral) and lets a chain
# run go on (the next room's objective sends Link back).
# `treasure:` whether this visit takes the room's game.yaml treasure (fights for it when the kills make it appear):
# absent = take it, `skip` = leave it, `clear` = kill every enemy first (no treasure needed) and take the drops,
# `{if_bombs_below: N}` = take it only while Link holds fewer than N bombs.
# `bomb_reserve: N`: from this step on (until a later step sets another; 0 at the start) Link keeps N bombs for what
# the route needs them for: outside `requires_bombs` rooms (game.yaml) BOMB is masked while he holds N or fewer, but
# for the 10th damage-free kill, which arms a forced bomb drop (Lee, Nov 11; docs/decisions.md).
# in_cave rooms follow v1 game.yaml: same (level, location) with in_cave: true.  An underworld item cellar is an
# in_cave room too, under its own room id (Dungeon 1's bow cellar 0x7f under 0x22, Dungeon 3's raft cellar 0x0f
# under 0x69), left N up its ladder.
#
# d2first: wood sword, east along row 5 to Dungeon 2 (3 hearts), Dodongo, his heart container and the D2 triforce
# (warps Link to 0x3c); round to 0x2c, bomb its rock wall for the take-any cave's heart container (5 hearts), the
# white sword at 0x0a, then west and south to Dungeon 1 (both key rooms, the bow cellar and the boomerang) through
# Aquamentus (6 hearts) to the D1 triforce (warps Link to 0x37); then east, south and west to Dungeon 3 (0x74), the
# raft cellar, Manhandla (7 hearts) and the D3 triforce (warps Link to 0x74); then back to 0x65, by raft from 0x55 to
# the island 0x45 and Dungeon 4 (docs/routes/d4.md): the ladder, Gleeok (8 hearts); the route ends on taking the D4
# triforce.  Never the fairy.
d2first:
- {level: 0, room: '0x77', specialist: ow-start, entry: start, exit: cave}
- {level: 0, room: '0x77', in_cave: true, specialist: ow-start, entry: S, exit: S}
