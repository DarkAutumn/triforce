# The route (docs/routes/d2first.md; Lee, Nov 8: the only route; the bow detour and Dungeon 3, Nov 9).
# entry = side of the room Link enters from (start = game start, cave = emerging from a cave/dungeon stairs/cellar or
# the triforce's warp); exit = direction Link leaves (cave = enter the cave, dungeon stairs or cellar stairs in this
# room; triforce = level ends on pickup, asm:Item_Take -> GameMode $12 -> OW; terminal = the route ends on entering
# this room; a route without a terminal step ends on its last step's triforce; maze = leave a maze room by its
# sequence into the maze's destination, round 24: each earlier direction of it loops back into the room; recorder
# (round 26) = the whirlwind carries Link off: the next step is the room it sets him down in, `entry: recorder`; the
# plays and Link's facing are computed from the game's index $523, zelda::whirlwind).  An exit through an intact bomb
# wall (game.yaml `bomb_walls`) sends Link to the spot to bomb it from; an exit `cave` behind an overworld secret
# (game.yaml `entrance: {how: armos | recorder}`, round 26) to the Armos's side, or the pond, then its stairs.
# The objective follows the steps: in a room the route enters from the side Link came in, with the triforce pieces,
# sword, bow, raft and ladder the route has there, the step's exit is the correct one (zelda::objectives).
# `waypoint: heart` (cave step): take the cave's heart container; leaving its room without it is `missed`.
# `waypoint: rupees` (cave step): take the cave's rupees (0x67's secret, round 22); leaving its room without them is
# `missed`.
# `waypoint: bow` / `raft` / `ladder` / `recorder` / `candle` (cellar step): take the cellar's item; until then the
# objective leads back to it.
# `waypoint: arrows` / `food` (round 26, shop cave step): buy the ware (the cave's game.yaml treasure); done once Link
# holds it; leaving the room without it or buying another ware is `missed`.  The cave's game.yaml `requires_rupees`
# tops a short purse up (cheated and counted).
# `waypoint: sword` (round 27, the magic sword's cave step): take the cave's sword (its game.yaml treasure); done once
# Link holds it; leaving its overworld room without it, or standing in the cave with fewer heart containers than the
# old man asks (he refuses: 12 for the magic sword), is `missed`.
# An exit `cave` behind a pushed gravestone (game.yaml `entrance: {how: push}` in a room with a `cave` exit, round 27:
# 0x21) sends Link to the square under the stone, MOVE N from there pushes it, and the MOVE ends on the stairs.
# A game.yaml dungeon exit with `keep_out: true` (round 27) is masked for MOVE unless the step leaves through it.
# An exit `cave` behind a tree the candle burns (game.yaml `entrance: {how: burn}` in a room with a `cave` exit, round
# 28: 0x6d) sends Link to a stand tile on the tree's row (three tiles E of it, facing W; three W of it, facing E);
# CANDLE is offered there only, toward the tree, while it stands and no fire of Link's burns; then its stairs.
# `bombs: never|tenth|required|free` (round 28): on this step the family's `items: {bombs:}` mode is this one
# (8:0x6e: boss-manhandla, `free`, crosses to the bomb wall by the BOMB mask of `required`).  Round 37: a route's
# own bomb rules (the owner's: `fights_only`, `wall_only`, `treasure_below`, `treasure_below_rooms`) are the
# top-level `bomb_rules:` below the routes, by route name.
# `drops: first` (round 31): on this step the family's `reward.drops_first` is on: once the objective is no fight, a
# wanted drop lying in the room (bombs below Link's maximum, a heart or fairy below full health) replaces the exit as
# the target until taken or gone (6:0x78, the ringleader room: a bomb pack its Wizzrobes drop is taken on the way).
# Round 31: leaving a level by its entrance room's S door is a step once (1:0x73 `exit: S`, game.yaml's one one-way
# level exit): the next step is the overworld room entered from `cave`, left `cave` back into the level.
# Round 29 (the leg to Dungeon 9, Dungeon 9, Ganon, Zelda): exit `end` = the game ends in this room (9:0x32: the
# first frame of game mode $13, Link in front of Zelda); it is the route's last step, and a route ends on a triforce
# or on it.  `waypoint: ring` / `silver-arrow` (cellar step): take the cellar's red ring or silver arrow, as the bow;
# every later step is matched by a Link who holds it.  `banked_kills: N` (a dungeon room the route comes back to):
# the kills the earlier visit left banked there (LevelKillCounts; 15 = the game's "all dead"); a start state of the
# step enters the room with them, as a played run does.  `sword: false`: SWORD and BEAMS are masked on the step
# (9:0x06's old man).  An exit `cave` behind a tree burned from above (0x47: CANDLE S from the tiles of its column
# over it) and one behind a rock wall over a level's stairs (0:0x05, `bomb_secret`) are targets as 0x6d's and 0x2c's.
# A game.yaml room with `requires_pieces: 8` (9:0x66) is `missed` to a Link with fewer Triforce pieces; an exit with
# `never_opens: true` (9:0x41 S, 9:0x31 S) is never planned through.
# A route is a list of steps, or `{extends: <a route above>, steps: [...]}`: that route's steps, then these.
# `{include: NAME}` (phase X, the lead, Nov 19) stands for the steps (and stretches) of the block NAME of the
# top-level `blocks:`: what two routes play alike is written once there (each dungeon's inside, the legs both take),
# so a change to it reaches both.  A block holds no include; every block is included somewhere.
# A route's `own_models_until: {waypoint: NAME}` (round 32, the lead): the route's own runs (`promoted.<route>`) play
# its steps before the one step NAME marks, every family's default run (`promoted`) that step and the rest; a route
# without it plays its own runs on every step (zelda::GameMap::step_policy).  Kept by a route extending it.
# An exit that is a game.yaml raft crossing (`raft_exits`) sends Link to its dock; the raft does the rest.
# `retreat: S`: leaving through that exit instead ends a one-room episode as `retreat` (neutral) and lets a chain
# run go on (the next room's objective sends Link back).
# `treasure:` whether this visit takes the room's game.yaml treasure (fights for it when the kills make it appear):
# absent = take it, `skip` = leave it, `clear` = kill every enemy first (no treasure needed) and take the drops,
# `{if_bombs_below: N}` = take it only while Link holds fewer than N bombs, `refuse` = leave it, and taking it costs
# (the critic's `penalty-refused-treasure`; Dungeon 5's 0x65 westbound).
# `bomb_reserve: N`: from this step on (until a later step sets another; 0 at the start) Link keeps N bombs for what
# the route needs them for: BOMB as a weapon is masked while he holds N or fewer of his own, inside a bomb-wall room
# as outside (round 26; a `free` family's BOMB at the wall the route leaves through stays), but for the 10th
# damage-free kill, which arms a forced bomb drop (Lee, Nov 11; docs/decisions.md).  A fight the bombs are kept for
# sets its own step's reserve (0: Manhandla, Digdogger, the Olive Garden, 3:0x5b's last pass, whose own four bombs
# pay for what follows).  Bombs a room grants (game.yaml `requires_bombs`, `zelda::cheats`) only open its wall.
# `rupee_reserve: N` (round 26): the same for rupees, kept for the route's arrows: ARROW is masked while Link holds
# N or fewer (families have arrows off unless their `items:` turns them on).
# `grant: {bombs: N}` (round 32; items `bombs`, `keys`, `rupees`): the first time a run reaches this step Link's count
# of the item (without a room's grant) is topped up to N; the units added are granted by the route, outstanding until
# used whichever room that is (cheated and counted there; leaving a room never takes them back) and bound to no wall;
# while they are outstanding a room's need is met by the room's own grant (`zelda::cheats`).  No route grants
# anything (the owner, Nov 21: d3first's bag of 8 at Dungeon 5's entrance is gone; the goal is a win without a
# cheated bomb, not a bag handed over).
# in_cave rooms follow v1 game.yaml: same (level, location) with in_cave: true.  An underworld item cellar is an
# in_cave room too, under its own room id (Dungeon 1's bow cellar 0x7f under 0x22, Dungeon 3's raft cellar 0x0f
# under 0x69), left N up its ladder.  A tunnel cellar (Dungeon 5's 0x07) has two ladders, game.yaml exits W (X < $80)
# and E: a step leaves by its own.
# `stretch: NAME` (round 22) is a list element holding two ways through the rooms where they differ, chosen by the
# run-time clips switch: `clips:` (switch on) and `plain:` (off), each a list of steps.  `parts: {level, room, entry}`
# names where they part (both ways' first step: that room, entered from that side, left differently) and `rejoins:`
# where they meet again (the shared step right after the block, which each way's last step leads into).  Steps are
# numbered in file order, the clip way's first; a run follows the way of its switch, and a step of the other way
# is off its route.  Turned off on the clip way the objective leads back to the plain way; turned on on the plain
# way the plain way holds to the rejoin (zelda::objectives::GameCompletion::set_clips_allowed).  Both ways must
# carry the same progress and bomb reserve to the rejoin, and hold no waypoint or triforce.  Round 29: the two ways'
# first steps may also leave the room by the same exit when they differ in what else they carry (Dungeon 9's
# `ring-07`: 9:0x07 out of the ring cellar holds the kills of its fight on the plain way, `banked_kills: 5`, and is
# full on the clip way, which clipped past them); both are one visit, one state name, and a start state's kept kills
# follow its switch.
#
# d2first: wood sword, east along row 5 to Dungeon 2 (3 hearts), Dodongo, his heart container and the D2 triforce
# (warps Link to 0x3c); round to 0x2c, bomb its rock wall for the take-any cave's heart container (5 hearts), the
# white sword at 0x0a, then west and south to Dungeon 1 (out and back in at its entrance for the open N door, 0x53's
# bomb wall, the bow cellar and the boomerang; phase IX) through
# Aquamentus (6 hearts) to the D1 triforce (warps Link to 0x37); then east and south to 0x67's secret cave (bomb, 30
# rupees) and on to Dungeon 3 (0x74) by the wrap exit or along row 6, the raft cellar, Manhandla (7 hearts) and the D3
# triforce (warps Link to 0x74); then back to 0x65, by raft from 0x55 to the island 0x45 and Dungeon 4
# (docs/routes/d4.md): the ladder, 0x01's key, Gleeok (8 hearts) and the D4 triforce (warps Link to 0x45); round 24
# (docs/routes/d5-leg.md, d5.md): by raft back to 0x55, the coast heart containers of 0x5f (9 hearts) and 0x2f's cave
# (10), 0x0f's 100 rupees, the mountain to Dungeon 5 (0x0b), the recorder, Digdogger (11 hearts) and the D5 triforce
# (warps Link to 0x0b); round 26 (docs/routes/d7.md): the whirlwind to 0x45, the shops 0x44 (arrows) and 0x34 (food),
# 0x42's pond, Dungeon 7: the red candle, Aquamentus (12 hearts) and the D7 triforce (sets Link down at 0x42); round
# 27 (docs/routes/d6.md): the magic sword and Dungeon 6, Gohma (13 hearts) and the D6 triforce (sets Link down at
# 0x22); round 28 (docs/routes/d8.md): the whirlwind to 0x3c, 0x6d's burned tree, Dungeon 8: Gleeok (14 hearts) and
# the D8 triforce (sets Link down at 0x6d); round 29 (docs/routes/d9.md): the whirlwind to 0x37, 0x47's heart
# container (15 hearts), 0x05's rock wall, Dungeon 9: the red ring, the silver arrow, Ganon and Zelda's room, whose
# exit is the end of the game (`exit: end`, game mode $13): the route ends there.  Never the fairy.
