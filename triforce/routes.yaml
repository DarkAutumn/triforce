# Second route after Dungeon 1 (Lee, round 6): south past the fairy pond (0x39 refills every heart), east along
# the 0x5x row, north into 0x4d and on to D2 as milestone1 does. Same as milestone1 outside the replaced steps.
# `waypoint: fairy`: the objective sends Link to the pond edge until his hearts are full, then out.
milestone1-fairy:
  base: milestone1
  replace: {from: {level: 0, room: '0x38', entry: W}, to: {level: 0, room: '0x4c', entry: E}}
  steps:
  - {level: 0, room: '0x38', specialist: ow-zora, entry: W, exit: S}
  - {level: 0, room: '0x48', specialist: ow-zora, entry: N, exit: S}
  - {level: 0, room: '0x58', specialist: ow-octorok, entry: N, exit: E}
  - {level: 0, room: '0x59', specialist: ow-zora, entry: W, exit: N}
  - {level: 0, room: '0x49', specialist: ow-octorok, entry: S, exit: N}
  - {level: 0, room: '0x39', specialist: ow-start, entry: S, exit: S, waypoint: fairy}
  - {level: 0, room: '0x49', specialist: ow-octorok, entry: N, exit: S}
  - {level: 0, room: '0x59', specialist: ow-zora, entry: N, exit: E}
  - {level: 0, room: '0x5a', specialist: ow-zora, entry: W, exit: E}
  - {level: 0, room: '0x5b', specialist: ow-moblin, entry: W, exit: E}
  - {level: 0, room: '0x5c', specialist: ow-moblin, entry: W, exit: E}
  - {level: 0, room: '0x5d', specialist: ow-moblin, entry: W, exit: N}
  - {level: 0, room: '0x4d', specialist: ow-moblin, entry: S, exit: W}
