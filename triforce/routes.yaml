# The route (docs/routes/d2first.md; Lee, Nov 8: the only route; the bow detour, Nov 9).
# entry = side of the room Link enters from (start = game start, cave = emerging from a cave/dungeon stairs/cellar or
# the triforce's warp); exit = direction Link leaves (cave = enter the cave, dungeon stairs or cellar stairs in this
# room; triforce = level ends on pickup, Z_01 TakeItem -> GameMode $12 -> OW; terminal = the route ends on entering
# this room; a route without a terminal step ends on its last step's triforce).
# The objective follows the steps: in a room the route enters from the side Link came in, with the triforce pieces,
# sword and bow the route has there, the step's exit is the correct one (zelda::objectives).
# `waypoint: heart` (cave step): take the cave's heart container; leaving its room without it is `missed`.
# `waypoint: bow` (cellar step): take the cellar's bow; until then the objective leads back to it.
# `retreat: S`: leaving through that exit instead ends a one-room episode as `retreat` (neutral) and lets a chain
# run go on (the next room's objective sends Link back).
# in_cave rooms follow v1 game.yaml: same (level, location) with in_cave: true.  An underworld item cellar is an
# in_cave room too, under its own room id (Dungeon 1's bow cellar 0x7f under 0x22), left N up its ladder.
#
# d2first: wood sword, east along row 5 to Dungeon 2 (3 hearts), Dodongo, his heart container and the D2 triforce
# (warps Link to 0x3c); round to 0x2c, bomb its rock wall for the take-any cave's heart container (5 hearts), the
# white sword at 0x0a, then west and south to Dungeon 1 (both key rooms, the bow cellar and the boomerang) through
# Aquamentus (6 hearts); the route ends on taking the D1 triforce.  Never the fairy.
d2first:
- {level: 0, room: '0x77', specialist: ow-start, entry: start, exit: cave}
- {level: 0, room: '0x77', in_cave: true, specialist: ow-start, entry: S, exit: S}
- {level: 0, room: '0x77', specialist: ow-start, entry: cave, exit: N}
- {level: 0, room: '0x67', specialist: ow-octorok, entry: S, exit: E}
- {level: 0, room: '0x68', specialist: ow-octorok, entry: W, exit: N}
- {level: 0, room: '0x58', specialist: ow-octorok, entry: S, exit: E}
- {level: 0, room: '0x59', specialist: ow-zora, entry: W, exit: E}
- {level: 0, room: '0x5a', specialist: ow-zora, entry: W, exit: E}
- {level: 0, room: '0x5b', specialist: ow-moblin, entry: W, exit: E}
- {level: 0, room: '0x5c', specialist: ow-moblin, entry: W, exit: E}
- {level: 0, room: '0x5d', specialist: ow-moblin, entry: W, exit: N}
- {level: 0, room: '0x4d', specialist: ow-moblin, entry: S, exit: W}
- {level: 0, room: '0x4c', specialist: ow-octorok, entry: E, exit: N}
- {level: 0, room: '0x3c', specialist: ow-octorok, entry: S, exit: cave}
- {level: 2, room: '0x7d', specialist: d2-rope, entry: S, exit: E}
- {level: 2, room: '0x7e', specialist: d2-rope, entry: W, exit: N}
- {level: 2, room: '0x6e', specialist: d2-rope, entry: S, exit: N}
- {level: 2, room: '0x5e', specialist: goriya, entry: S, exit: N}
- {level: 2, room: '0x4e', specialist: d2-rope, entry: S, exit: N}
- {level: 2, room: '0x3e', specialist: moldorm, entry: S, exit: N}
