# Pixel rows the FCEUmm comparison ignores (plan step 8). Each entry is a row where Zelda writes a PPU
# register in the middle of a visible line and FCEUmm's line-granular renderer (LineUpdate/RefreshLine/
# CopySprites, libretro-fceumm src/ppu.c) composes that line differently from a dot-accurate PPU. In
# every case the CPU trace, RAM, PRG-RAM, CHR, CIRAM, palette and OAM are identical frame for frame;
# only those rows' pixels differ. `tf diff` blanks these rows in both the golden and the backend.

[[allow]]
movie = "*"
rows = [63, 64]
reason = """Status-bar split: after the sprite 0 hit and a counted delay loop (Z_05.asm:1263+), Zelda
writes $2006/$2005 around line 63, dot ~230 (e.g. chain-milestone1-91 frame 869: STA $2006 at CPU
cycle 45573897, STY $2006 at 45573901). FCEUmm re-renders the rest of line 63 from the new address at the
instruction's timestamp; a dot-accurate PPU picks it up two tiles later, after its fetch pipeline, so
the right end of line 63 and the first background fetches of line 64 differ."""

[[allow]]
movie = "power_on_to_start"
frames = [121, 121]
rows = [49, 49]
reason = """Title -> file select: $2001 = $00 written at line 49, dot 250 (rendering off mid-line).
FCEUmm composes sprites for a whole line at its end, only if sprites are still enabled, so line 49 has no
sprites at all; a dot-accurate PPU draws them up to dot 250."""

[[allow]]
movie = "file_select_register_erase"
frames = [121, 121]
rows = [49, 49]
reason = "Same title -> file select $2001 write as power_on_to_start frame 121."
