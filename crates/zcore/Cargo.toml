[package]
name = "zcore"
description = "Zelda-only NES core, subtracted from TetaNES (tetanes-core); see UPSTREAM.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[[bench]]
name = "frames"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
print_literal = "warn"

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_compatibility = "warn"
rust_2018_idioms = "warn"
rust_2021_compatibility = "warn"
unused = "warn"

[features]
default = []
trace = []

[dependencies]
bitflags = { version = "2.10", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
sha1_smol = "1.0.1"
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std", "release_max_level_info"] }
zstd = "0.14.3"

[dev-dependencies]
anyhow = "1.0"
bincode = { version = "2.0", default-features = false, features = ["std", "serde"] }
blake3 = "1.8.7"
image = { version = "0.25", default-features = false, features = ["png"] }
movie = { path = "../movie" }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "std", "registry", "parking_lot"] }
