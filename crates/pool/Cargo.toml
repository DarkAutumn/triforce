[package]
name = "pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["zelda"]
# Adapters that run `env::SpecialistEnv` / `env::ChainEnv` in a pool (generic over `zelda::Nes`).
zelda = ["dep:env", "dep:zelda", "dep:serde_json"]

[dependencies]
env = { path = "../env", optional = true }
parking_lot = "0.12.5"
rand_chacha = "0.10.0"
serde_json = { version = "1.0.154", features = ["preserve_order"], optional = true }
zelda = { path = "../zelda", optional = true }

[dev-dependencies]
rand = "0.10.3"
zcore = { path = "../zcore" }
zelda = { path = "../zelda", features = ["zcore"] }

[[test]]
name = "zelda_oracle"
required-features = ["zelda"]
