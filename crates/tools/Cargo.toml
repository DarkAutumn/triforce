[package]
name = "triforce-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
movie = { path = "../movie" }
rand = "0.10.3"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Renamed: `tf` has a `replay` module of its own (TFMOVIE playback).
tfreplay = { package = "replay", path = "../replay", features = ["zcore"] }
sha1_smol = "1.0.1"
toml = "1.2.0"
zcore = { path = "../zcore" }
zelda = { path = "../zelda" }

[dev-dependencies]
test-rom = { path = "../test-rom" }
