[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "triforce"
version = "1.3.2.0"
description = "Specialist PPO agents that play The Legend of Zelda (NES) from structured RAM state"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch",
    "gymnasium",
    "tensorboard",
    "pillow",
]

[project.optional-dependencies]
gui = ["pyside6-essentials>=6.7", "pygame"]                # pygame: `triforce.run --render`
dev = ["pytest", "pyyaml", "pyside6-essentials>=6.7", "pygame"]

[project.scripts]
triforce = "triforce.cli:main"

[tool.maturin]
python-source = "."
module-name = "triforce._native"
manifest-path = "crates/triforce-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests over the whole stack (run by default; select with '-m e2e')",
]
