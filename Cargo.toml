[workspace]
resolver = "3"
members = [
    "crates/zcore",
    "crates/zelda",
    "crates/env",
    "crates/pool",
    "crates/triforce-py",
    "crates/tools",
    "crates/movie",
    "crates/policy",
    "crates/test-rom",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "1.3.1"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
