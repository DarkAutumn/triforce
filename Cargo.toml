[workspace]
resolver = "3"
members = [
    "crates/zcore",
    "crates/zelda",
    "crates/env",
    "crates/pool",
    "crates/triforce-py",
    "crates/tools",
    "crates/movie",
    "crates/policy",
    "crates/replay",
    "crates/test-rom",
    "crates/theater",
    "crates/paths",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "2.0.1"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1

# The Rust suite's builds (`triforce job test rust`): release optimisation without link-time optimisation, which
# made every one of the 60 test programs re-optimise the whole crate graph (Nov 23: 2459 of 2621 CPU seconds).
[profile.release-tests]
inherits = "release"
lto = "off"
